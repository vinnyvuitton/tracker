<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Our Shopping"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://vinny-workout-api.vinny-olsauskas.workers.dev; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"><title>Our Shopping</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="stylesheet" href="shopping.css"></head>
<body><header class="masthead"><div><p class="eyebrow">A little easier, together</p><h1>Our shopping</h1></div><button id="settings" class="quiet">Help & settings</button></header><div class="connection" id="connection" role="status">Opening your private list…</div><main id="content"></main><nav class="tabs" aria-label="Shopping navigation"><button data-tab="list">☷ <span>List</span></button><button data-tab="ask">✦ <span>Ask</span></button><button data-tab="updates">◉ <span>Updates</span></button></nav>
<dialog id="editor"><form id="editor-form"><div class="dialog-title"><h2 id="editor-title"></h2><button type="button" id="close-editor" class="quiet" aria-label="Close">Close</button></div><div id="editor-fields"></div><p id="editor-error" role="alert"></p><div class="actions"><button type="submit" id="editor-save">Save</button><button type="button" id="cancel-editor" class="secondary">Cancel</button></div></form></dialog>
<dialog id="access"><form id="access-form"><p class="eyebrow">Just for us</p><h2>Open your shopping list</h2><p>Use the shopping access code Vinny shared with you.</p><label>Shopping access code<input id="access-code" type="password" autocomplete="current-password" required></label><p id="access-error" role="alert"></p><button type="submit">Open my list</button><button type="button" id="use-vinny" class="secondary">Use Vinny’s dashboard access on this device</button></form></dialog>
<div id="notice" role="status" hidden></div><script src="shopping.js"></script></body></html>
