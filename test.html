<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Tracker">
<title>My Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300..900&family=Archivo+Black&family=JetBrains+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
:root{
--bg:#ebe6dc;--bg2:#f3efe7;--paper:#fff;
--ink:#131210;--ink2:#2a2824;
--mut:#8b8a85;--mut2:#c5c2bb;
--ln:#ddd6c8;--ln2:#e8e1d3;
--pop:#38e98d;--popD:#1f9e5c;
--info:#3aaaff;
--terra:#c14a32;--terraD:#9a3a26;--terraL:#d96a4f;
--heat-1:#b8826a;--heat-2:#c47352;--heat-3:#cf6840;--heat-4:#d96030;--heat-5:#dc5520;
--heat-6:#df4f15;--heat-7:#d94010;--heat-8:#c93608;--heat-9:#b62e04;--heat-10:#9e2200;
--gold:#d4a857;--goldD:#a07a2c;--goldL:#e8c075;
--warn:#ff5d3a;--success:#10b981;
}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',sans-serif;max-width:480px;margin:0 auto;padding-bottom:100px;min-height:100vh;letter-spacing:-.1px}
button,textarea,input{font-family:inherit}
.shell{position:relative;min-height:100vh}
.shell::before{content:'';position:fixed;inset:0;max-width:480px;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 18% 8%,rgba(56,233,141,.06),transparent 40%),radial-gradient(circle at 88% 92%,rgba(193,74,50,.05),transparent 40%);pointer-events:none;z-index:0}
.shell>*{position:relative;z-index:1}
.hdr{padding:20px 18px 6px}
.hdr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hdr-l{font-weight:800;font-size:13px;letter-spacing:-.2px;text-transform:uppercase;display:flex;align-items:center;gap:9px;color:var(--ink)}
.hdr-dot{width:8px;height:8px;background:var(--pop);border-radius:50%;box-shadow:0 0 0 4px rgba(56,233,141,.18)}
.hdr-r{display:flex;gap:6px;align-items:center}
.pill{padding:7px 11px;background:var(--paper);border-radius:99px;font-size:10.5px;font-weight:600;letter-spacing:.2px;box-shadow:0 1px 2px rgba(0,0,0,.04);font-family:Archivo,sans-serif;border:none;cursor:pointer;color:var(--ink)}
.pill.dk{background:var(--ink);color:var(--bg)}
.pill.on{background:var(--terra);color:#fff}
.hdr-title{font-family:'Archivo Black',sans-serif;font-size:20px;letter-spacing:-.6px;color:var(--ink);margin-top:2px}
.sync-bar{display:flex;align-items:center;gap:8px;margin:6px 18px 14px;padding:8px 12px;background:var(--paper);border-radius:12px;border:1px solid var(--ln2)}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .3s}
.sync-txt{font-size:10.5px;flex:1;font-weight:600;letter-spacing:.3px}
.sync-btn{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:4px 10px;font-size:10px;color:var(--ink2);cursor:pointer;font-weight:600;font-family:Archivo,sans-serif}
.dp{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 14px 12px}
.dpc{background:var(--paper);border-radius:14px;padding:10px 4px 9px;text-align:center;position:relative;border:1.5px solid transparent;cursor:pointer;transition:transform .12s}
.dpc:active{transform:scale(.96)}
.dpc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dpc.rest{opacity:.55}
.dpc-d{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1px;color:var(--mut);text-transform:uppercase;font-weight:600}
.dpc.on .dpc-d{color:rgba(235,230,220,.55)}
.dpc-n{font-family:'Archivo Black',sans-serif;font-size:16px;margin-top:2px;letter-spacing:-.5px;color:var(--ink)}
.dpc.on .dpc-n{color:var(--bg)}
.dpc-tag{font-size:8px;letter-spacing:.5px;color:var(--mut);margin-top:1px;font-weight:600;text-transform:uppercase}
.dpc.on .dpc-tag{color:var(--pop)}
.dpc.done::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--popD)}
.dpc.on.done::after{background:var(--pop)}
.vtog{display:flex;gap:6px;padding:0 18px 12px}
.vbtn{background:transparent;border:1.5px solid var(--ln);border-radius:99px;padding:7px 14px;color:var(--mut);font-size:11px;cursor:pointer;font-family:Archivo,sans-serif;font-weight:600;letter-spacing:.2px;text-transform:uppercase}
.vbtn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pg{padding:0 14px}
.card{background:var(--paper);border-radius:18px;padding:18px;margin-bottom:12px;border:1px solid var(--ln2)}
.card.dk{background:var(--ink);color:var(--bg);border:none}
.slbl{font-size:9px;letter-spacing:2.5px;color:var(--mut);text-transform:uppercase;margin-bottom:12px;font-weight:700}
.card.dk .slbl{color:var(--mut2)}
.bar{margin-bottom:7px}
.blr{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);margin-bottom:3px;font-weight:600}
.bt{background:var(--bg2);border-radius:3px;height:5px;overflow:hidden}
.bf{height:100%;border-radius:3px;transition:width .3s}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{background:var(--bg2);border-radius:10px;padding:9px 4px;text-align:center}
.cv{font-size:14px;font-weight:800;letter-spacing:-.3px}
.cl{font-size:8.5px;color:var(--mut);margin-top:2px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.wseg{flex:1;height:6px;border-radius:3px;background:var(--bg2);cursor:pointer;transition:background .15s}
.wseg.on{background:var(--info)}
.addbtn{background:var(--terra);border:none;border-radius:10px;padding:7px 14px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.3px;text-transform:uppercase}
.mta{width:100%;background:var(--bg2);border:1px solid var(--ln2);border-radius:10px;color:var(--ink);font-size:13px;padding:11px;resize:none;height:64px;margin-bottom:8px;display:block;font-family:Archivo,sans-serif}
.mta:focus{outline:none;border-color:var(--terra)}
.phbtn{width:100%;background:var(--bg2);border:1px dashed var(--ln);border-radius:10px;padding:11px 0;color:var(--mut);font-size:12px;cursor:pointer;margin-bottom:10px;font-family:Archivo,sans-serif;font-weight:600}
.cancelbtn{flex:1;background:transparent;border:1px solid var(--ln);border-radius:10px;color:var(--ink2);font-size:12px;padding:9px 0;cursor:pointer;font-family:Archivo,sans-serif;font-weight:600}
.anlzbtn{flex:2;background:var(--terra);border:none;border-radius:10px;color:#fff;font-size:12px;font-weight:700;padding:9px 0;cursor:pointer;font-family:Archivo,sans-serif;letter-spacing:.3px;text-transform:uppercase}
.anlzbtn:disabled{background:var(--mut2);opacity:.6}
.ex-card{border-radius:14px;padding:14px;margin-bottom:8px;border:1px solid var(--ln2);background:var(--paper);transition:border-color .2s}
.ex-card.done{border-left:3px solid var(--success);background:rgba(16,185,129,.04)}
.ex-card.prog{border:1px solid var(--gold);border-left:3px solid var(--gold);background:rgba(212,168,87,.05)}
.ex-card.todo{opacity:.65}
.ex-circle-done{width:22px;height:22px;border-radius:50%;background:var(--success);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.ex-circle-prog{width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:var(--paper)}
.ex-circle-todo{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mut2);flex-shrink:0;cursor:pointer;background:var(--paper)}
.demo-btn{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:5px 10px;font-size:10px;color:var(--ink2);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:Archivo,sans-serif;font-weight:600;letter-spacing:.2px}
.demo-btn.on{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.erbtn{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;font-size:11px;cursor:pointer;color:var(--ink2);font-family:Archivo,sans-serif;font-weight:600;letter-spacing:.2px}
.erbtn.sel{border-color:var(--success);background:rgba(16,185,129,.1);color:var(--popD)}
.ex-note{background:var(--bg2);border:1px solid var(--ln2);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--mut);cursor:pointer;margin-top:8px;font-family:'Instrument Serif',serif;font-style:italic}
.ex-note.has{color:var(--ink2);font-style:normal;font-family:Archivo,sans-serif}
.ex-textarea{width:100%;background:var(--paper);border:1.5px solid var(--gold);border-radius:10px;color:var(--ink);font-size:13px;padding:9px 11px;resize:none;height:60px;display:block;margin-top:8px;font-family:Archivo,sans-serif}
.ex-textarea:focus{outline:none;border-color:var(--terra)}
.ex-hist{font-size:9.5px;letter-spacing:.4px;color:var(--mut);margin-top:4px;font-family:'JetBrains Mono',monospace}
.ex-hist b{color:var(--terra);font-weight:700}
.cann-btn{flex:1;height:50px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;font-family:inherit;line-height:1;transition:all .15s;-webkit-tap-highlight-color:rgba(193,74,50,.12)}
.cann-btn:active{transform:scale(.96)}
.cann-used{border-color:var(--terra);background:rgba(193,74,50,.08)}
.cann-clean{border-color:var(--success);background:rgba(16,185,129,.09)}
.cann-note{width:100%;background:var(--bg2);border:1px solid var(--ln2);border-radius:10px;color:var(--ink);font-size:16px;padding:10px 12px;resize:none;height:56px;display:block;margin-top:10px;font-family:Archivo,sans-serif;line-height:1.4}
.cann-note:focus{outline:none;border-color:var(--terra)}
.pgtoggle{background:transparent;border:1.5px solid var(--ln);border-radius:10px;padding:8px 14px;color:var(--ink2);font-size:11px;cursor:pointer;width:100%;margin:10px 0 0;font-family:Archivo,sans-serif;font-weight:600;letter-spacing:.2px;text-transform:uppercase}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pslot{background:var(--bg2);border:1.5px dashed var(--ln);border-radius:14px;aspect-ratio:3/4;position:relative;overflow:hidden;cursor:pointer}
.pslot.has{border-style:solid;border-color:var(--ln2)}
.pimg{width:100%;height:100%;object-fit:cover;display:block}
.prem{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);border:none;border-radius:50%;width:26px;height:26px;color:#fff;font-size:11px;cursor:pointer;z-index:2}
.ptyp{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9px;color:rgba(255,255,255,.7);letter-spacing:1px;text-transform:uppercase;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.pslot:not(.has) .ptyp{color:var(--mut);text-shadow:none}
.wo-notes-textarea{width:100%;background:var(--bg2);border:1px solid var(--ln2);border-radius:10px;color:var(--ink);font-size:13px;padding:10px 12px;resize:none;height:78px;display:block;font-family:Archivo,sans-serif;line-height:1.4}
.wo-notes-textarea:focus{outline:none;border-color:var(--terra)}
.drow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln2);cursor:pointer}
.drow:last-child{border-bottom:none}
.drow.rest{opacity:.45}
.wchart{display:flex;align-items:flex-end;gap:4px;height:60px;padding-top:10px;border-top:1px solid var(--ln2);margin-top:14px}
.wbarw{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.wbar{width:100%;border-radius:3px 3px 0 0;min-height:2px}
.expbtn{width:100%;background:var(--terra);border:none;border-radius:10px;padding:11px 0;color:#fff;font-size:13px;font-weight:700;margin-top:14px;cursor:pointer;font-family:Archivo,sans-serif;letter-spacing:.3px;text-transform:uppercase}
.expbtn:disabled{background:var(--mut2);color:var(--mut)}
.expbtn.done{background:var(--success)}
.arch-card{background:var(--paper);border:1px solid var(--ln2);border-radius:18px;padding:18px;margin-bottom:12px;cursor:pointer}
.arch-card.open{border-color:var(--terra)}
.goal-card{background:var(--paper);border:1px solid var(--ln2);border-radius:18px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;transition:background .6s ease}
.goal-bar-track{background:var(--bg2);border-radius:3px;height:6px;position:relative;overflow:hidden}
.goal-bar-fill{height:100%;border-radius:3px;position:relative;overflow:hidden;transition:width .4s ease}
.goal-bar-fill.shimmer::after{content:"";position:absolute;top:0;left:-50%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:goal-shimmer 2.4s linear infinite}
@keyframes goal-shimmer{0%{left:-50%}100%{left:150%}}
.goal-bar-fill.glow-green{box-shadow:0 0 8px rgba(16,185,129,.5)}
.goal-bar-fill.locked-in{animation:goal-bar-locked 1.6s ease-in-out infinite}
@keyframes goal-bar-locked{0%,100%{box-shadow:0 0 6px rgba(16,185,129,.4)}50%{box-shadow:0 0 16px rgba(16,185,129,.95)}}
.goal-lock{display:inline-block;transition:all .4s ease}
.goal-lock.gl-1{animation:gl-pulse-1 5s ease-in-out infinite;filter:drop-shadow(0 0 2px rgba(193,74,50,.4))}
.goal-lock.gl-2{animation:gl-pulse-2 4.5s ease-in-out infinite;filter:drop-shadow(0 0 4px rgba(196,115,82,.55))}
.goal-lock.gl-3{animation:gl-pulse-3 4s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(207,104,64,.65))}
.goal-lock.gl-4{animation:gl-pulse-4 3.4s ease-in-out infinite;filter:drop-shadow(0 0 7px rgba(217,96,48,.7))}
.goal-lock.gl-5{animation:gl-pulse-5 3s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(220,85,32,.75))}
.goal-lock.gl-6{animation:gl-pulse-6 2.6s ease-in-out infinite;filter:drop-shadow(0 0 9px rgba(223,79,21,.8))}
.goal-lock.gl-7{animation:gl-pulse-7 2.3s ease-in-out infinite;filter:drop-shadow(0 0 11px rgba(217,64,16,.85))}
.goal-lock.gl-8{animation:gl-pulse-8 2s ease-in-out infinite,gl-tremor 8s ease-in-out infinite;filter:drop-shadow(0 0 13px rgba(201,54,8,.9))}
.goal-lock.gl-9{animation:gl-pulse-9 1.7s ease-in-out infinite,gl-tremor 5s ease-in-out infinite;filter:drop-shadow(0 0 15px rgba(182,46,4,.95))}
.goal-lock.gl-10{animation:gl-pulse-10 1.4s ease-in-out infinite,gl-tremor 3s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(158,34,0,1))}
.goal-lock.gl-unlocked{animation:gl-unlocked-pulse 2s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(16,185,129,.95))}
@keyframes gl-pulse-1{0%,100%{filter:drop-shadow(0 0 2px rgba(193,74,50,.3))}50%{filter:drop-shadow(0 0 5px rgba(193,74,50,.55))}}
@keyframes gl-pulse-2{0%,100%{filter:drop-shadow(0 0 3px rgba(196,115,82,.4))}50%{filter:drop-shadow(0 0 7px rgba(196,115,82,.7))}}
@keyframes gl-pulse-3{0%,100%{filter:drop-shadow(0 0 4px rgba(207,104,64,.5))}50%{filter:drop-shadow(0 0 9px rgba(207,104,64,.8))}}
@keyframes gl-pulse-4{0%,100%{filter:drop-shadow(0 0 5px rgba(217,96,48,.55))}50%{filter:drop-shadow(0 0 11px rgba(217,96,48,.85))}}
@keyframes gl-pulse-5{0%,100%{filter:drop-shadow(0 0 6px rgba(220,85,32,.6))}50%{filter:drop-shadow(0 0 13px rgba(220,85,32,.9))}}
@keyframes gl-pulse-6{0%,100%{filter:drop-shadow(0 0 7px rgba(223,79,21,.65))}50%{filter:drop-shadow(0 0 14px rgba(223,79,21,.95))}}
@keyframes gl-pulse-7{0%,100%{filter:drop-shadow(0 0 8px rgba(217,64,16,.7))}50%{filter:drop-shadow(0 0 16px rgba(217,64,16,1))}}
@keyframes gl-pulse-8{0%,100%{filter:drop-shadow(0 0 9px rgba(201,54,8,.75))}50%{filter:drop-shadow(0 0 18px rgba(201,54,8,1))}}
@keyframes gl-pulse-9{0%,100%{filter:drop-shadow(0 0 10px rgba(182,46,4,.8))}50%{filter:drop-shadow(0 0 20px rgba(182,46,4,1))}}
@keyframes gl-pulse-10{0%,100%{filter:drop-shadow(0 0 12px rgba(158,34,0,.85))}50%{filter:drop-shadow(0 0 24px rgba(158,34,0,1))}}
@keyframes gl-tremor{0%,93%,100%{transform:translateX(0) rotate(0deg)}94%{transform:translateX(-1px) rotate(-2deg)}95%{transform:translateX(1px) rotate(2deg)}96%{transform:translateX(-1px) rotate(-1deg)}97%{transform:translateX(1px) rotate(1deg)}98%{transform:translateX(0) rotate(0deg)}}
@keyframes gl-unlocked-pulse{0%,100%{filter:drop-shadow(0 0 12px rgba(16,185,129,.7))}50%{filter:drop-shadow(0 0 22px rgba(16,185,129,1))}}
.goal-shoe{transition:filter .6s ease}
.goal-shoe.aura-1{filter:drop-shadow(0 0 4px rgba(193,74,50,.25))}
.goal-shoe.aura-2{filter:drop-shadow(0 0 6px rgba(207,104,64,.4));animation:goal-shoe-breath 4s ease-in-out infinite}
.goal-shoe.aura-3{filter:drop-shadow(0 0 9px rgba(217,96,48,.55));animation:goal-shoe-breath 3.4s ease-in-out infinite}
.goal-shoe.aura-4{filter:drop-shadow(0 0 12px rgba(223,79,21,.7));animation:goal-shoe-breath 2.8s ease-in-out infinite}
.goal-shoe.aura-5{filter:drop-shadow(0 0 18px rgba(201,54,8,.85));animation:goal-shoe-breath 2.2s ease-in-out infinite}
.goal-shoe.aura-earned{filter:drop-shadow(0 0 16px rgba(212,168,87,.85));animation:goal-shoe-gold 3s ease-in-out infinite}
@keyframes goal-shoe-breath{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes goal-shoe-gold{0%,100%{filter:drop-shadow(0 0 12px rgba(212,168,87,.7))}50%{filter:drop-shadow(0 0 24px rgba(212,168,87,1))}}
.goal-days-num{transition:color .6s ease}
.goal-days-num.dn-1{animation:goal-days-pulse 4s ease-in-out infinite}
.goal-days-num.dn-2{animation:goal-days-pulse 3s ease-in-out infinite}
.goal-days-num.dn-3{animation:goal-days-flicker .15s steps(2,end) infinite,goal-days-pulse 2s ease-in-out infinite}
@keyframes goal-days-pulse{0%,100%{opacity:.95;text-shadow:0 0 4px rgba(193,74,50,.4)}50%{opacity:1;text-shadow:0 0 12px rgba(217,64,16,.85)}}
@keyframes goal-days-flicker{0%{opacity:1}50%{opacity:.7}}
.goal-card.tier-warm{background:linear-gradient(180deg,#f5e8d6 0%,#fff 100%)}
.goal-card.tier-hot{background:linear-gradient(180deg,#f0d8c0 0%,#f8eddb 100%)}
.goal-card.tier-final{background:linear-gradient(180deg,#ebc8a8 0%,#f5dec3 100%)}
.goal-card.tier-earned{background:linear-gradient(180deg,#dde9d4 0%,#eaf0e0 100%)}
.goal-ember{position:absolute;bottom:-8px;width:3px;height:3px;border-radius:50%;background:var(--terra);opacity:0;pointer-events:none}
.goal-ember.on{animation:goal-ember-rise 4s linear infinite}
@keyframes goal-ember-rise{0%{bottom:-8px;opacity:0;transform:translateX(0)}10%{opacity:.85}90%{opacity:.4}100%{bottom:100%;opacity:0;transform:translateX(15px)}}
.goal-lightning{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(255,200,150,.25),transparent 60%);opacity:0;pointer-events:none;border-radius:18px}
.goal-lightning.on{animation:goal-lightning-flash 12s ease-in-out infinite}
.goal-lightning.fast{animation:goal-lightning-flash 7s ease-in-out infinite}
.goal-lightning.faster{animation:goal-lightning-flash 4s ease-in-out infinite}
@keyframes goal-lightning-flash{0%,93%,100%{opacity:0}94%{opacity:.7}95%{opacity:.2}96%{opacity:.85}97%{opacity:0}}
.goal-pill{display:inline-block;background:rgba(16,185,129,.12);border:1px solid var(--success);border-radius:10px;padding:2px 8px;font-size:8px;letter-spacing:1.5px;color:var(--popD);text-transform:uppercase;margin-left:6px;animation:goal-pill-in .5s ease;font-weight:700}
@keyframes goal-pill-in{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
.goal-earned-banner{background:linear-gradient(90deg,rgba(16,185,129,.08) 0%,rgba(16,185,129,.15) 100%);border:1px solid var(--success);border-radius:12px;padding:14px;text-align:center;margin-top:14px;animation:goal-banner-in .8s ease;position:relative;overflow:hidden}
@keyframes goal-banner-in{0%{transform:translateY(-10px);opacity:0}100%{transform:translateY(0);opacity:1}}

// ============ SECTION 2: SAVE/SYNC ============
function updateSyncBar(){
  const el=document.getElementById("sync-bar");
  if(!el) return;
  const dot=el.querySelector(".sync-dot");
  const txt=el.querySelector(".sync-txt");
  const map={
    idle:["#10b981","All synced"],
    pending:["#d4a857","Saving..."],
    saving:["#3aaaff","Syncing..."],
    error:["#c14a32","Sync failed"],
    offline:["#8b8a85","Offline"]
  };
  const [c,t]=map[S.syncStatus]||map.idle;
  if(dot) dot.style.background=c;
  if(txt) txt.textContent=t;
}

let saveTimer=null;
function scheduleSave(){
  if(!appReady) return;
  S.syncStatus="pending";
  updateSyncBar();
  try{localStorage.setItem("mytracker",JSON.stringify(AW))}catch(e){}
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(executeSave,600);
}

async function executeSave(){
  if(!appReady) return;
  S.syncStatus="saving";
  updateSyncBar();
  try{
    const r=await fetch(CLOUD_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"save",data:AW})});
    if(!r.ok) throw new Error("save failed");
    S.syncStatus="idle";
  }catch(e){
    S.syncStatus="error";
    console.error("save error",e);
  }
  updateSyncBar();
}

async function forceSave(){
  if(saveTimer) clearTimeout(saveTimer);
  await executeSave();
}

function nd(){return{p:0,c:0,w:0,wt:null,m:[],ex:{},er:{},en:{},ph:null,cn:null,cnNote:"",dn:"",dp:null,cp:null}}
function gw(k){if(!AW[k])AW[k]={};return AW[k]}
function gday(k,d){const w=gw(k);if(!w[d])w[d]=nd();return w[d]}

function sdayNoRedraw(k,d,fn){const day=gday(k,d);fn(day);scheduleSave()}
function gex(k,d,n){const day=gday(k,d);if(!day.ex[n])day.ex[n]={s:"todo"};return day.ex[n]}
function sex(k,d,n,fn){const e=gex(k,d,n);fn(e);scheduleSave();draw()}
function sexNoRedraw(k,d,n,fn){const e=gex(k,d,n);fn(e);scheduleSave()}

function exTotalCount(d){if(PLAN[d].rest)return 0;let c=0;for(const sec of PLAN[d].sections)c+=sec.ex.length;return c}

function isDayQualifiedWorkout(day,dname){
  if(PLAN[dname]&&PLAN[dname].rest)return false;
  const total=exTotalCount(dname);
  if(total===0)return false;
  return exDoneCount(day)>=Math.ceil(total*0.7);
}

function hasTrainedToday(){
  const k=wkKey(new Date()),d=DAYS[(new Date().getDay()+6)%7];
  if(!AW[k]||!AW[k][d])return false;

}

function isDayEmpty(day){
  if(!day)return true;
  if(day.p>0||day.c>0||day.w>0||day.wt)return false;
  if(day.m&&day.m.length>0)return false;
  if(day.cn||day.dn||day.ph||day.dp||day.cp)return false;
  for(const k in day.ex||{})if(day.ex[k].s&&day.ex[k].s!=="todo")return false;
  return false;
}

// ============ SECTION 4: GOAL ENGINE ============
function calcGoalStats(){
  const now=new Date();
  const start=new Date(GOAL.savingsStartDate+"T00:00:00-05:00");
  const deadline=new Date(GOAL.deadline+"T00:00:00-05:00");
  
  // Weeks elapsed since start, capped
  const msPerWk=7*24*60*60*1000;
  const weeksElapsed=Math.max(0,Math.floor((now-start)/msPerWk));
  const weeksTotal=Math.ceil((deadline-start)/msPerWk);
  
  // Iterate week keys from epoch floor forward
  const wkKeys=[];
  let cursor=GOAL.epochTs;
  while(cursor<=now.getTime()){
    wkKeys.push(cursor);
    cursor+=msPerWk;
  }
  
  // Count qualified weeks per criterion
  let workoutWks=0,proteinWks=0,waterWks=0;
  
  for(const k of wkKeys){
    const w=AW[k]||{};
    // Workout: at least 3 qualified workout days
    let woDays=0;
    for(const d of DAYS){
      if(w[d]&&isDayQualifiedWorkout(w[d],d))woDays++;
    }
    if(woDays>=3)workoutWks++;
    
    // Protein: hit PG on at least 5 days
    let pDays=0;
    for(const d of DAYS){
      if(w[d]&&w[d].p>=PG)pDays++;
    }
    if(pDays>=5)proteinWks++;
    
    // Water: hit WG on at least 5 days
    let wDays=0;
    for(const d of DAYS){
      if(w[d]&&w[d].w>=WG)wDays++;
    }
    if(wDays>=5)waterWks++;
  }
  
  // Weight goal
  const recentWt=getMostRecentWeight();
  const weightProgress=recentWt&&recentWt<=GOAL.targetWeight?1:0;
  
  // Savings calculation
  const savedAmt=Math.min(GOAL.shoePriceWithTax,weeksElapsed*GOAL.savingsWeekly);
  
  // Days remaining
  const daysLeft=Math.max(0,Math.ceil((deadline-now)/(24*60*60*1000)));
  
  // Criteria targets (e.g. need 10 weeks of consistency)
  const targetWks=10;
  const c1=Math.min(1,workoutWks/targetWks);
  const c2=Math.min(1,proteinWks/targetWks);
  const c3=Math.min(1,waterWks/targetWks);
  const c4=weightProgress;
  
  const allMet=(workoutWks>=targetWks)&&(proteinWks>=targetWks)&&(waterWks>=targetWks)&&weightProgress>=1;
  const overallProgress=(c1+c2+c3+c4)/4;
  const criteriaMet=(workoutWks>=targetWks?1:0)+(proteinWks>=targetWks?1:0)+(waterWks>=targetWks?1:0)+(weightProgress>=1?1:0);
  
  return{
    workoutWks,proteinWks,waterWks,
    targetWks,
    weightCurrent:recentWt,
    weightTarget:GOAL.targetWeight,
    weightProgress,
    c1,c2,c3,c4,
    overallProgress,
    criteriaMet,
    allMet,
    weeksElapsed,
    weeksTotal,
    savedAmt,
    daysLeft
  };
}

function getMostRecentWeight(){
  let latest=null,latestTs=0;
  for(const k in AW){
    for(const d in AW[k]){
      const day=AW[k][d];
      if(day.wt){
        const dayTs=parseInt(k)+(DAYS.indexOf(d)*24*60*60*1000);
        if(dayTs>latestTs){latestTs=dayTs;latest=day.wt}
      }
    }
  }
  return latest;
}

function calcCannabisStats(){
  const now=new Date();
  const msPerWk=7*24*60*60*1000;
  const wkKeys=[];
  let cursor=GOAL.epochTs;
  while(cursor<=now.getTime()){wkKeys.push(cursor);cursor+=msPerWk}
  
  let totalClean=0,weeklyMajority=0,longest=0,current=0,allDays=[];
  
  for(const k of wkKeys){
    const w=AW[k]||{};
    let weekClean=0,weekTotal=0;
    for(const d of DAYS){
      if(w[d]&&w[d].cn){
        weekTotal++;
        const isClean=w[d].cn==="N";
        allDays.push({k,d,clean:isClean});
        if(isClean){weekClean++;totalClean++}
      }
    }
    if(weekTotal>0&&weekClean>weekTotal/2)weeklyMajority++;
  }
  
  // Streaks
  let run=0;
  for(const ad of allDays){
    if(ad.clean){run++;if(run>longest)longest=run}
    else run=0;
  }
  // Current streak (from latest backward)
  for(let i=allDays.length-1;i>=0;i--){
    if(allDays[i].clean)current++;
    else break;
  }
  
  return{totalClean,weeklyMajority,longest,current};
}

  const pct=Math.round(prog*100);
  const met=have>=need;
  const fillClass=met?"glow-green locked-in":(prog>=.7?"shimmer":"");
  const bg=met?"var(--success)":prog>=.7?"linear-gradient(90deg,var(--gold),var(--terra))":"var(--terra)";
  return `<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">

  </div>`;

function weightCritRow(g){
  const cur=g.weightCurrent;
  const tgt=g.weightTarget;
  const met=cur&&cur<=tgt;
  const display=cur?`${cur} → ${tgt}`:`-- → ${tgt}`;
  const fillClass=met?"glow-green locked-in":"shimmer";
  const bg=met?"var(--success)":"linear-gradient(90deg,var(--gold),var(--terra))";
  // Progress: assume 160 starting weight as 0%, target weight as 100%
  let prog=0;
  if(cur){const start=160;prog=Math.max(0,Math.min(1,(start-cur)/(start-tgt)))}
  return `<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div style="font-size:11.5px;font-weight:600;color:var(--ink2)">Weight goal${met?' <span style="color:var(--popD);font-size:10px">✓</span>':""}</div>

}

// ============ SECTION 7: API + MEAL ============
async function callAPI(messages,opts){
  opts=opts||{};
  const body={action:"chat",messages,model:"claude-sonnet-4-20250514",max_tokens:opts.max||1200};
  if(opts.tools)body.tools=opts.tools;
  if(opts.system)body.system=opts.system;
  const r=await fetch(CLOUD_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("api error");
  return r.json();
}

async function analyzeMeal(){
  const txt=S.mt?S.mt.trim():"";
  const photo=S.mp;
  if(!txt&&!photo)return;
  
  const btn=document.getElementById("anlz-btn");
  if(btn){btn.disabled=true;btn.textContent="Analyzing..."}
  
  try{
    const content=[];
    if(photo){content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:photo.split(",")[1]}})}
    content.push({type:"text",text:`Analyze this meal and respond ONLY with JSON: {"name":"...","p":N,"c":N,"f":N,"cal":N}. ${txt?`User notes: ${txt}`:""}`});
    
    const resp=await callAPI([{role:"user",content}]);
    let txtOut="";
    for(const blk of resp.content||[]){if(blk.type==="text")txtOut+=blk.text}
    txtOut=txtOut.replace(/```json|```/g,"").trim();
    const m=JSON.parse(txtOut);
    
    const k=wkKey(new Date()),d=DAYS[(new Date().getDay()+6)%7];
    sday(k,d,day=>{
      if(!day.m)day.m=[];
      day.m.push({n:m.name||"Meal",p:m.p||0,c:m.c||0,f:m.f||0,cal:m.cal||0,t:Date.now()});
      day.p=(day.p||0)+(m.p||0);
      day.c=(day.c||0)+(m.cal||0);
    });
    S.mt="";S.mp=null;S.mpp=null;S.smf=null;
    draw();
  }catch(e){
    alert("Couldn't analyze. Try again.");
    if(btn){btn.disabled=false;btn.textContent="Analyze"}
  }
}

function rmMeal(idx){
  const k=wkKey(new Date()),d=DAYS[(new Date().getDay()+6)%7];
  sday(k,d,day=>{
    const m=day.m[idx];
    if(m){
      day.p=Math.max(0,(day.p||0)-(m.p||0));
      day.c=Math.max(0,(day.c||0)-(m.cal||0));
      day.m.splice(idx,1);
    }
  });
}

async function doExport(){
  S.exporting=true;draw();
  try{
    const k=wkKey(new Date());
    const w=AW[k]||{};
    const exportData={};
    for(const d of DAYS){
      if(w[d]){

        // Convert photos to text descriptions via API
        if(day.dp){ed.dp_summary=await describePhoto(day.dp.front||day.dp.side,"progress")}
        if(day.cp){ed.cp_summary=await describePhoto(day.cp,"cardio")}
        if(day.ph){ed.ph_summary=await describePhoto(day.ph,"workout")}
        exportData[d]=ed;
      }
    }
    // Save the summary into history
    if(!AW.history)AW.history={};
    AW.history[k]={summary:exportData,exportedAt:Date.now()};

    for(const d of DAYS){

    }
    scheduleSave();
    finishExport();
  }catch(e){

    draw();
    alert("Export failed");
  }
}
async function describePhoto(d,kind){

// ============ SECTION 9: HELPERS ============
function pcolor(p){
  if(p>=PG)return"var(--success)";
  if(p>=PG*.7)return"var(--gold)";
  return"var(--terra)";
}
function ring(p,c,size){
  size=size||60;
  const r=size/2-4;
  const circ=2*Math.PI*r;
  const off=circ-Math.min(1,p/c)*circ;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg2)" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${pcolor(p)}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
function mkbar(label,val,target,color){
  const pct=Math.min(100,(val/target)*100);
  return `<div class="bar"><div class="blr"><span>${label}</span><span><b>${Math.round(val)}</b>/${target}</span></div><div class="bt"><div class="bf" style="width:${pct}%;background:${color||"var(--ink)"}"></div></div></div>`;
}
function wkstats(k){
  const w=AW[k]||{};
  let pAvg=0,wAvg=0,cAvg=0,d=0,wt=null;
  for(const dn of DAYS){
    if(w[dn]){
      pAvg+=w[dn].p||0;wAvg+=w[dn].w||0;cAvg+=w[dn].c||0;d++;
      if(w[dn].wt)wt=w[dn].wt;
    }
  }
  return{p:d?Math.round(pAvg/d):0,w:d?Math.round(wAvg/d):0,c:d?Math.round(cAvg/d):0,wt}
}

// ============ SECTION 11: LIFT HISTORY ============
function liftHistory(exName){
  const wks=Object.keys(AW).filter(k=>!isNaN(parseInt(k))).map(k=>parseInt(k)).sort((a,b)=>b-a).slice(0,5);
  const vals=[];
  for(const k of wks){
    const w=AW[k];
    for(const d of DAYS){
      if(w[d]&&w[d].en&&w[d].en[exName]){
        const note=w[d].en[exName];
        // Try to extract a number
        const m=note.match(/(\d+(?:\.\d+)?)/);
        if(m){vals.push(parseFloat(m[1]));break}
      }
    }
    if(vals.length>=4)break;
  }
  if(vals.length===0)return"";
  vals.reverse();
  const trend=vals.length>1?(vals[vals.length-1]>vals[0]?"↑":vals[vals.length-1]<vals[0]?"↓":"="):"";
  return `<div class="ex-hist">last ${vals.length}: ${vals.join(" · ")} <b>${trend}</b></div>`;
}

function renderWeekSummary(k){
  const w=AW[k]||{};
  const stats=wkstats(k);
  const wts=[];
  for(const d of DAYS){if(w[d]&&w[d].wt)wts.push({d,wt:w[d].wt})}
  const maxWt=wts.length?Math.max(...wts.map(x=>x.wt)):0;
  const minWt=wts.length?Math.min(...wts.map(x=>x.wt)):0;
  
  let html=`<div class="card">
    <div class="slbl">Week Summary · ${wlbl(k)}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
      <div style="background:var(--bg2);border-radius:10px;padding:10px;text-align:center">
        <div style="font-family:'Archivo Black',sans-serif;font-size:18px">${stats.p}</div>
        <div style="font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:1.3px;margin-top:3px;font-weight:700">Avg P</div>
      </div>
      <div style="background:var(--bg2);border-radius:10px;padding:10px;text-align:center">
        <div style="font-family:'Archivo Black',sans-serif;font-size:18px">${stats.c}</div>
        <div style="font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:1.3px;margin-top:3px;font-weight:700">Avg Cal</div>
      </div>
      <div style="background:var(--bg2);border-radius:10px;padding:10px;text-align:center">
        <div style="font-family:'Archivo Black',sans-serif;font-size:18px">${stats.wt||"--"}</div>
        <div style="font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:1.3px;margin-top:3px;font-weight:700">Latest Wt</div>
      </div>
    </div>`;
  
  // Daily breakdown
  for(const d of DAYS){
    const dy=w[d];
    const isRest=PLAN[d]&&PLAN[d].rest;
    if(!dy&&!isRest)continue;
    const tot=isRest?0:exTotalCount(d);
    const dn=isRest?0:(dy?exDoneCount(dy):0);
    html+=`<div class="drow ${!dy?"rest":""}">
      <div><div style="font-weight:700;font-size:12px">${d}</div><div style="font-size:10px;color:var(--mut)">${DTYPES[d]}</div></div>
      <div style="text-align:right">
        ${dy?`<div style="font-size:11px;font-weight:600">${dy.p||0}p · ${dy.w||0}w</div>${tot?`<div style="font-size:10px;color:var(--mut)">${dn}/${tot} ex</div>`:""}`:`<div style="font-size:11px;color:var(--mut)">No data</div>`}
      </div>
    </div>`;
  }
  
  // Weight chart
  if(wts.length>1){
    html+=`<div class="wchart">`;
    for(const d of DAYS){
      const wd=w[d];
      const wt=wd&&wd.wt?wd.wt:null;
      const h=wt?Math.max(2,((wt-minWt)/(maxWt-minWt||1))*50):0;
      html+=`<div class="wbarw"><div class="wbar" style="height:${h}px;background:${wt?"var(--terra)":"var(--bg2)"}"></div><div style="font-size:8px;color:var(--mut);margin-top:2px">${d.charAt(0)}</div></div>`;
    }
    html+=`</div>`;
  }
  
  // Export button
  if(S.expDone){
    html+=`<button class="expbtn done">✓ Exported</button>`;
  }else{
    html+=`<button class="expbtn" ${S.exporting?"disabled":""} onclick="doExport()">${S.exporting?"Exporting...":"Export & Clear Photos"}</button>`;
  }
  
  html+=`</div>`;
  
  // History archive
  if(AW.history){
    const hist=AW.history;
    const hKeys=Object.keys(hist).sort((a,b)=>parseInt(b)-parseInt(a));
    for(const hk of hKeys){
      const open=S.expandedWk===hk;
      html+=`<div class="arch-card ${open?"open":""}" onclick="S.expandedWk=S.expandedWk==='${hk}'?null:'${hk}';draw()">
        <div style="display:flex;justify-content:space-between"><div class="slbl" style="margin:0">${wlbl(hk)}</div><div style="font-size:10px;color:var(--mut)">${open?"▴":"▾"}</div></div>
        ${open?`<pre style="margin-top:10px;font-size:10px;color:var(--ink2);font-family:'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-word">${JSON.stringify(hist[hk].summary,null,2).slice(0,2000)}</pre>`:""}
      </div>`;
    }
  }
  
  return html;
}

function collectWeights(days){
  const out=[];
  const today=new Date();
  for(let i=days-1;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const k=wkKey(d);
    const dn=DAYS[(d.getDay()+6)%7];
    const day=AW[k]?.[dn];
    out.push({date:d,wt:day?day.wt:null});
  }
  return out;
}
function collectProtein(days){
  const out=[];
  const today=new Date();
  for(let i=days-1;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const k=wkKey(d);
    const dn=DAYS[(d.getDay()+6)%7];
    const day=AW[k]?.[dn];
    out.push({date:d,p:day?day.p||0:0});
  }
  return out;
}
function collectTopMeals(){
  const tally={};
  for(const k in AW){
    if(k==="history")continue;
    const w=AW[k];
    for(const d in w){
      const day=w[d];
      if(day.m){
        for(const m of day.m){
          if(!tally[m.n])tally[m.n]={n:m.n,p:0,c:0};
          tally[m.n].p+=m.p||0;
          tally[m.n].c+=1;
        }
      }
    }
  }
  return Object.values(tally).sort((a,b)=>b.p-a.p);
}

function tgCtx(){
  const k=wkKey(new Date()),d=DAYS[(new Date().getDay()+6)%7];
  const day=gday(k,d);
  const g=calcGoalStats();
  const cs=calcCannabisStats();
  const plan=PLAN[d];
  
  let exSummary="";
  if(plan&&!plan.rest){
    const total=exTotalCount(d);
    const done=exDoneCount(day);
    exSummary=`Today's plan: ${plan.title}. Done ${done}/${total}.`;
  }
  
  return{
    today:d,
    dayType:DTYPES[d],
    isRest:plan&&plan.rest,
    pro:day.p||0,proTarget:PG,
    cal:day.c||0,calTarget:CG,

    goalDaysLeft:g.daysLeft,
    goalCriteriaMet:g.criteriaMet,
    cannabisCleanDays:cs.totalClean,

  };
}

function tgGreeting(){
  const c=tgCtx();
  const h=new Date().getHours();
  let title="",sub="",btns=[];
  
  if(h>=5&&h<6){
    title=`<em>Let's go.</em>`;
    sub="Pre-workout fuel?";
    btns=["What should I eat right now","Quick warmup","I'm tired today"];
  }else if(h>=6&&h<11){
    if(c.pro<30){
      title=`Protein at breakfast?`;
      sub=`You're at <b>${c.pro}g</b>. Easy wins.`;
      btns=["3 quick high-protein breakfasts","Why does this matter","I already ate"];
    }else{
      title=`Solid start.`;
      sub=`<b>${c.pro}g</b> protein in. Keep it rolling.`;
      btns=["What's next","Mid-morning snack ideas","How's my week looking"];
    }
  }else if(h>=11&&h<14){
    title=`Lunch check.`;
    sub=`<b>${c.pro}g</b>. Need <b>${Math.max(0,PG-c.pro)}g</b> more.`;
    btns=["High-protein lunch ideas","I had X for lunch (log it)","Quick portion check"];
  }else if(h>=14&&h<18){
    if(c.pro<PG*.7){
      title=`<em>You're behind.</em>`;
      sub=`<b>${PG-c.pro}g</b> short. Still doable.`;
      btns=["Catch up plan","Quick high-pro snacks","I'm not hungry"];
    }else{
      title=`On pace.`;
      sub=`Dinner brings it home.`;
      btns=["Dinner ideas","I had X (log it)","How's my week"];
    }
  }else if(h>=18&&h<22){
    title=`Dinner time.`;
    sub=c.pro>=PG?`Already hit. Maintain.`:`<b>${PG-c.pro}g</b> to go.`;
    btns=["Dinner ideas","I had X (log it)","Tomorrow's plan"];
  }else{
    title=`Late check-in.`;
    sub=c.workoutDone?`Today: ✓`:`Tomorrow's a fresh start.`;
    btns=["How was today","Tomorrow's plan","Sleep tips"];
  }
  
  return{title,sub,btns};
}

function tgEsc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function tgFormat(s){
  let t=tgEsc(s);
  t=t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  t=t.replace(/\*([^*]+)\*/g,"<em>$1</em>");
  return t;
}

  tgSend();
}

function tgPhotoChosen(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{S.tgPhoto=e.target.result;S.tgPhotoData=e.target.result.split(",")[1];tgRender();
    // Show preview in input area
  };
  r.readAsDataURL(f);
}
function tgClearPhoto(){S.tgPhoto=null;S.tgPhotoData=null;tgRender()}

function tgConfirmMeal(mc){
  const k=wkKey(new Date()),d=DAYS[(new Date().getDay()+6)%7];
  sday(k,d,day=>{
    if(!day.m)day.m=[];
    day.m.push({n:mc.name,p:mc.p,c:mc.c,f:mc.f,cal:mc.cal,t:Date.now()});
    day.p=(day.p||0)+(mc.p||0);
    day.c=(day.c||0)+(mc.cal||0);
  });
  // Mark this card as confirmed in chat
  for(const m of S.tgChat){if(m.mealCard===mc){m.mealCard=null;m.text="✓ Logged."}}
  tgRender();
}
function tgDismissMeal(){
  for(const m of S.tgChat){if(m.mealCard){m.mealCard=null;m.text="Skipped."}}
  tgRender();
}

async function tgSend(){
  const inp=document.getElementById("tg-input");
  const text=inp?inp.value.trim():"";
  if(!text&&!S.tgPhoto)return;
  
  const userMsg={role:"user",text};
  if(S.tgPhoto){userMsg.image=S.tgPhoto;userMsg.imageData=S.tgPhotoData}
  S.tgChat.push(userMsg);
  
  if(inp){inp.value="";inp.style.height="42px"}
  const photo=S.tgPhoto;
  S.tgPhoto=null;S.tgPhotoData=null;
  S.tgBusy=true;
  tgRender();
  
  try{
    const apiMsgs=[];
    for(const m of S.tgChat){
      if(m.role==="user"){
        const content=[];
        if(m.imageData){content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:m.imageData}})}
        if(m.text){content.push({type:"text",text:m.text})}
        apiMsgs.push({role:"user",content});
      }else if(m.role==="assistant"&&m.text){
        apiMsgs.push({role:"assistant",content:m.text});
      }
    }
    
    const isFood=text&&/eat|ate|meal|snack|breakfast|lunch|dinner|protein|cal|food/i.test(text);
    const opts={system:tgSysPrompt(),max:1500};
    if(isFood||photo){opts.tools=[{type:"web_search_20250305",name:"web_search"}]}
    
    const resp=await callAPI(apiMsgs,opts);
    let txt="";
    for(const blk of resp.content||[]){if(blk.type==="text")txt+=blk.text}
    
    // Detect MEAL_LOG block
    const mlMatch=txt.match(/\[MEAL_LOG\]\s*([\s\S]+?)\s*\[\/MEAL_LOG\]/);
    if(mlMatch){
      try{
        const mc=JSON.parse(mlMatch[1]);
        const cleanText=txt.replace(/\[MEAL_LOG\][\s\S]+?\[\/MEAL_LOG\]/,"").trim();
        if(cleanText)S.tgChat.push({role:"assistant",text:cleanText});
        S.tgChat.push({role:"assistant",mealCard:mc});
      }catch(e){
        S.tgChat.push({role:"assistant",text:txt});
      }
    }else{
      S.tgChat.push({role:"assistant",text:txt});
    }
  }catch(e){
    S.tgChat.push({role:"assistant",text:"Couldn't connect. Try again."});
  }
  
  S.tgBusy=false;
  tgRender();
}
