function getWeekLabel(o){
  var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var s=new Date(WEEK_START+o*604800000),e=new Date(WEEK_START+o*604800000+518400000);
  return mo[s.getMonth()]+" "+s.getDate()+" - "+mo[e.getMonth()]+" "+e.getDate()+", "+s.getFullYear();
}

function newDay(){
  return{meals:[],water:0,weight:"",photoFront:null,photoSide:null,
    workout:{completed:false,rating:"",notes:""},
    exercises:{},
    p:0,cal:0,carbs:0,fat:0};
}

function getWeek(o){
  if(!AW[o]){AW[o]=[];for(var i=0;i<7;i++){AW[o].push(newDay());}}
  return AW[o];
}

var AW={};
var S={wo:0,ad:0,view:"log",showWkSum:false,expandedWk:null,
  smf:false,mealText:"",mealPhoto:null,mealPhotoPreview:null,
  ld:false,ae:"",exporting:false,exportDone:false,
  activeVideo:null};

function lsSave(){try{localStorage.setItem("mytracker",JSON.stringify(AW));}catch(e){}}
function lsLoad(){try{var r=localStorage.getItem("mytracker");if(r){AW=JSON.parse(r);}}catch(e){}}

function getDay(){return getWeek(S.wo)[S.ad];}

function setDay(fn){
  var wk=getWeek(S.wo);
  wk[S.ad]=fn(wk[S.ad]);
  AW[S.wo]=wk;
  lsSave();draw();
}

function setExercise(dayName,exName,field,val){
  var wk=getWeek(S.wo);
  var d=wk[S.ad];
  if(!d.exercises){d.exercises={};}
  if(!d.exercises[exName]){d.exercises[exName]={done:false,rating:"",note:"",active:false};}
  d.exercises[exName][field]=val;
  AW[S.wo]=wk;
  lsSave();draw();
}

function getExState(exName){
  var d=getDay();
  if(!d.exercises||!d.exercises[exName]){return{done:false,rating:"",note:"",active:false};}
  return d.exercises[exName];
}

function toggleExDone(exName){
  var cur=getExState(exName);
  var wk=getWeek(S.wo);
  var d=wk[S.ad];
  if(!d.exercises){d.exercises={};}
  if(!d.exercises[exName]){d.exercises[exName]={done:false,rating:"",note:"",active:false};}
  d.exercises[exName].done=!cur.done;
  d.exercises[exName].active=!cur.done?false:false;
  AW[S.wo]=wk;lsSave();draw();
}

function setExActive(exName){
  var wk=getWeek(S.wo);
  var d=wk[S.ad];
  if(!d.exercises){d.exercises={};}
  var keys=Object.keys(d.exercises);
  for(var ki=0;ki<keys.length;ki++){if(!d.exercises[keys[ki]].done){d.exercises[keys[ki]].active=false;}}
  if(!d.exercises[exName]){d.exercises[exName]={done:false,rating:"",note:"",active:false};}
  if(!d.exercises[exName].done){d.exercises[exName].active=!d.exercises[exName].active;}
  AW[S.wo]=wk;lsSave();draw();
}

function countExDone(){
  var d=getDay();
  if(!d.exercises){return 0;}
  var ct=0;
  var keys=Object.keys(d.exercises);
  for(var ki=0;ki<keys.length;ki++){if(d.exercises[keys[ki]].done){ct++;}}
  return ct;
}

function countExTotal(){
  var dn=DAYS[S.ad];
  if(!WORKOUT_PLAN[dn]){return 0;}
  var ct=0;
  var secs=WORKOUT_PLAN[dn].sections;
  for(var si=0;si<secs.length;si++){ct+=secs[si].exercises.length;}
  return ct;
}

function handleProgressPhoto(e,side){
  var f=e.target.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxDim=600;var w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
      canvas.width=w;canvas.height=h;
      var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
      var compressed=canvas.toDataURL('image/jpeg',0.6);
      setDay(function(d){var nd=JSON.parse(JSON.stringify(d));if(side==="front"){nd.photoFront=compressed;}else{nd.photoSide=compressed;}return nd;});
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
}

function removeProgressPhoto(side){
  setDay(function(d){var nd=JSON.parse(JSON.stringify(d));if(side==="front"){nd.photoFront=null;}else{nd.photoSide=null;}return nd;});
}

function handleMealPhoto(e){
  var f=e.target.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxDim=800;var w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
      canvas.width=w;canvas.height=h;
      var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
      var compressed=canvas.toDataURL('image/jpeg',0.7);
      S.mealPhoto=compressed.split(",")[1];S.mealPhotoPreview=compressed;draw();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
}

function callProxy(messages,maxTok,cb){
  fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTok,messages:messages})
  }).then(function(r){return r.json();}).then(function(data){
    var txt="";
    if(data.content){for(var i=0;i<data.content.length;i++){if(data.content[i].type==="text"){txt=data.content[i].text;break;}}}
    cb(null,txt);
  }).catch(function(err){cb(err,null);});
}

function analyzeMeal(){
  var ta=document.getElementById("meal-ta");
  if(ta)S.mealText=ta.value;
  if(!S.mealText&&!S.mealPhoto)return;
  S.ld=true;S.ae="";draw();
  var content=[];
  if(S.mealPhoto){content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:S.mealPhoto}});}
  var prompt=S.mealPhoto
    ?"Analyze this food photo"+(S.mealText?" plus: "+S.mealText:"")+". Return ONLY raw JSON no markdown: {\"name\":\"meal name\",\"protein\":25,\"carbs\":30,\"fat\":10,\"calories\":300}"
    :"Analyze: "+S.mealText+". Return ONLY raw JSON no markdown: {\"name\":\"meal name\",\"protein\":25,\"carbs\":30,\"fat\":10,\"calories\":300}";
  content.push({type:"text",text:prompt});
  callProxy([{role:"user",content:content}],400,function(err,txt){
    if(err){S.ld=false;S.ae="Could not analyze. Try again.";draw();return;}
    try{
      var parsed=JSON.parse(txt.replace(/```json|```/g,"").trim());
      var prev=S.mealPhotoPreview,inp=S.mealText;
      setDay(function(d){
        var nd=JSON.parse(JSON.stringify(d));
        nd.meals.push({name:parsed.name||"Meal",protein:parsed.protein||0,carbs:parsed.carbs||0,fat:parsed.fat||0,calories:parsed.calories||0,input:inp,photo:prev});
        nd.p+=parsed.protein||0;nd.cal+=parsed.calories||0;nd.carbs+=parsed.carbs||0;nd.fat+=parsed.fat||0;
        return nd;
      });
      S.mealText="";S.mealPhoto=null;S.mealPhotoPreview=null;S.smf=false;S.ld=false;S.ae="";
      draw();
    }catch(e){S.ld=false;S.ae="Could not parse response. Try again.";draw();}
  });
}

function removeMeal(idx){
  setDay(function(d){
    var nd=JSON.parse(JSON.stringify(d));
    var m=nd.meals[idx];
    nd.meals.splice(idx,1);
    nd.p-=m.protein||0;nd.cal-=m.calories||0;nd.carbs-=m.carbs||0;nd.fat-=m.fat||0;
    return nd;
  });
}

// EXPORT + PHOTO CLEANUP
function doExport(wkOffset){
  S.exporting=true;draw();
  var wk=getWeek(wkOffset);
  // Build photos list for analysis
  var photoItems=[];
  for(var di=0;di<7;di++){
    var d=wk[di];
    if(d.photoFront){photoItems.push({dayIdx:di,side:"front",data:d.photoFront.split(",")[1]});}
    if(d.photoSide){photoItems.push({dayIdx:di,side:"side",data:d.photoSide.split(",")[1]});}
    if(d.meals){
      for(var mi=0;mi<d.meals.length;mi++){
        if(d.meals[mi].photo){photoItems.push({dayIdx:di,mealIdx:mi,data:d.meals[mi].photo.split(",")[1]});}
      }
    }
  }

  // Build text summary
  var lines=["WEEKLY CHECK-IN - "+getWeekLabel(wkOffset)];
  var totalP=0,wkts=0,pdays=0,wts=[];
  for(var di=0;di<7;di++){
    var d=wk[di];
    totalP+=d.p;
    if(d.workout&&d.workout.completed){wkts++;}
    if(d.p>=PG){pdays++;}
    if(d.weight){wts.push(parseFloat(d.weight));}
  }
  var avgP=Math.round(totalP/7);
  var avgWt=wts.length?(wts.reduce(function(a,b){return a+b;},0)/wts.length).toFixed(1):"--";
  lines.push("Workouts: "+wkts+"/5");
  lines.push("Avg protein: "+avgP+"g (goal: "+PG+"g)");
  lines.push("Protein days: "+pdays+"/7");
  lines.push("Avg weight: "+avgWt+" lbs");

  // Exercise feedback
  var exFeedback=[];
  for(var di=0;di<7;di++){
    var d=wk[di];
    if(d.exercises){
      var exKeys=Object.keys(d.exercises);
      for(var eki=0;eki<exKeys.length;eki++){
        var ex=d.exercises[exKeys[eki]];
        if(ex.rating||ex.note){
          exFeedback.push(DAYS[di]+" "+exKeys[eki]+": "+(ex.rating||"")+(ex.note?" - "+ex.note:""));
        }
      }
    }
  }
  if(exFeedback.length){lines.push("Exercise feedback:");for(var fi=0;fi<exFeedback.length;fi++){lines.push("  "+exFeedback[fi]);}}

  var checkinText=lines.join("\n");

  // If no photos just copy and done
  if(photoItems.length===0){
    finishExport(wkOffset,checkinText,{});
    return;
  }

  // Analyze photos then clear them
  var allPhotoDescs={};
  var pending=photoItems.length;

  function analyzeOnePhoto(item){
    var content=[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:item.data}},
      {type:"text",text:"Describe this "+(item.side?"progress photo ("+item.side+" view)":"food photo")+" in one concise sentence for fitness tracking purposes. Be specific and objective."}];
    callProxy([{role:"user",content:content}],150,function(err,txt){
      var key=item.dayIdx+(item.side?"-"+item.side:"-meal"+item.mealIdx);
      allPhotoDescs[key]=txt||"Photo logged";
      pending--;
      if(pending===0){finishExport(wkOffset,checkinText,allPhotoDescs);}
    });
  }

  for(var pi=0;pi<photoItems.length;pi++){analyzeOnePhoto(photoItems[pi]);}
}

function finishExport(wkOffset,checkinText,photoDescs){
  // Replace photos with descriptions, clear actual image data
  var wk=getWeek(wkOffset);
  for(var di=0;di<7;di++){
    var d=wk[di];
    var frontKey=di+"-front",sideKey=di+"-side";
    if(d.photoFront){
      d.photoFront=null;
      d.photoFrontDesc=photoDescs[frontKey]||"Front progress photo";
    }
    if(d.photoSide){
      d.photoSide=null;
      d.photoSideDesc=photoDescs[sideKey]||"Side progress photo";
    }
    if(d.meals){
      for(var mi=0;mi<d.meals.length;mi++){
        if(d.meals[mi].photo){
          var mKey=di+"-meal"+mi;
          d.meals[mi].photoDesc=photoDescs[mKey]||"Food photo";
          d.meals[mi].photo=null;
        }
      }
    }
  }
  AW[wkOffset]=wk;
  lsSave();

  // Copy to clipboard
  navigator.clipboard.writeText(checkinText).then(function(){
    S.exporting=false;S.exportDone=true;draw();
    setTimeout(function(){S.exportDone=false;draw();},3000);
  }).catch(function(){
    S.exporting=false;S.exportDone=true;draw();
    setTimeout(function(){S.exportDone=false;draw();},3000);
  });
}

function protColor(v){return v>=PG?"#10b981":v>0?"#f59e0b":"#2a2a2a";}

function mkRing(val,max,color,size,sw){
  size=size||64;sw=sw||6;
  var r=(size-sw*2)/2,c=2*Math.PI*r,pct=Math.min(val/max,1);
  return '<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#181818" stroke-width="'+sw+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'"'+
    ' stroke-dasharray="'+(2*Math.PI*r)+'" stroke-dashoffset="'+(2*Math.PI*r*(1-pct))+'" stroke-linecap="round"/></svg>';
}

function mkBar(lbl,val,max,color){
  var unit=lbl==="Calories"?"":"g";
  var pct=Math.min(val/max*100,100);
  return '<div class="bar"><div class="blr"><span>'+lbl+'</span><span style="color:#999">'+val+unit+' / '+max+unit+'</span></div>'+
    '<div class="bt"><div class="bf" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
}

function buildWeekStats(wk){
  var totalP=0,wkts=0,pdays=0,wts=[];
  for(var i=0;i<7;i++){
    totalP+=wk[i].p;
    if(wk[i].workout&&wk[i].workout.completed){wkts++;}
    if(wk[i].p>=PG){pdays++;}
    if(wk[i].weight){wts.push(parseFloat(wk[i].weight));}
  }
  var avgP=Math.round(totalP/7);
  var lwts=wts.filter(function(w){return w>0;});
  var avgWt=lwts.length?(lwts.reduce(function(a,b){return a+b;},0)/lwts.length).toFixed(1):"--";
  return{avgP:avgP,wkts:wkts,pdays:pdays,wts:wts,avgWt:avgWt};
}

    h+='<div class="chip"><div class="cv" style="color:#f59e0b">'+day.carbs+'g</div><div class="cl">Carbs</div></div>';
    h+='<div class="chip"><div class="cv" style="color:#3b82f6">'+day.fat+'g</div><div class="cl">Fat</div></div>';
    h+='<div class="chip"><div class="cv" style="color:#10b981">'+day.cal+'</div><div class="cl">Calories</div></div>';
    h+='</div></div>';

    // WATER
    h+='<div class="card"><div class="wtrrow">';
    h+='<div><div class="slbl">Water</div><div class="wtrval">'+day.water+' / '+WG+' glasses</div></div>';
    h+='<div class="wtrbtns">';
    h+='<button class="wtrbtn wtrm" onclick="setDay(function(d){var nd=JSON.parse(JSON.stringify(d));nd.water=Math.max(0,d.water-1);return nd;})">-</button>';
    h+='<button class="wtrbtn wtrp" onclick="setDay(function(d){var nd=JSON.parse(JSON.stringify(d));nd.water=Math.min('+WG+',d.water+1);return nd;})">+</button>';
    h+='</div></div><div class="wsegs">';
    for(var wi2=0;wi2<WG;wi2++){
      h+='<div class="wseg'+(wi2<day.water?" on":"")+'" onclick="setDay(function(d){var nd=JSON.parse(JSON.stringify(d));nd.water='+(wi2+1)+';return nd;})"></div>';
    }
    h+='</div></div>';

    // MEALS
    h+='<div class="card"><div class="mhdr"><div class="slbl" style="margin:0">Meals</div>';
    h+='<button class="addbtn" onclick="S.smf=true;draw()">+ Add Meal</button></div>';
    if(S.smf){
      h+='<div class="mform"><div style="font-size:11px;color:#555;margin-bottom:10px">Upload a photo, describe your meal, or both. Claude fills in the macros.</div>';
      h+='<input type="file" id="meal-photo-input" accept="image/*" style="display:none" onchange="handleMealPhoto(event)">';
      if(S.mealPhotoPreview){
        h+='<div class="pvw"><img src="'+S.mealPhotoPreview+'" class="pvwimg"><button class="pvrm" onclick="S.mealPhoto=null;S.mealPhotoPreview=null;draw()">X</button><div class="pvbdg">Photo ready</div></div>';
      }else{
        h+='<button class="phbtn" onclick="document.getElementById(\'meal-photo-input\').click()">&#128247; Upload Food Photo (optional)</button>';
      }
      h+='<textarea class="mta" id="meal-ta" placeholder="Describe what you ate... e.g. grilled chicken, rice, broccoli">'+(S.mealText||"")+'</textarea>';
      if(S.ae){h+='<div class="aerr">'+S.ae+'</div>';}
      h+='<div class="fbtns"><button class="cancelbtn" onclick="S.smf=false;S.mealText=\'\';S.mealPhoto=null;S.mealPhotoPreview=null;S.ae=\'\';draw()">Cancel</button>';
      h+='<button class="anlzbtn" onclick="analyzeMeal()" '+(S.ld?"disabled":"")+'>'+( S.ld?"Analyzing...":"Analyze + Log")+'</button></div></div>';
    }
    if(day.meals.length===0&&!S.smf){h+='<div class="nomeal">No meals logged yet</div>';}
    for(var mi2=0;mi2<day.meals.length;mi2++){
      var m=day.meals[mi2];
      h+='<div class="mi"><div class="mihdr"><div style="flex:1"><div class="miname">'+m.name+'</div>'+(m.input?'<div class="midesc">'+m.input+'</div>':"")+
        '</div><button class="mirm" onclick="removeMeal('+mi2+')">X</button></div>';
      if(m.photo){h+='<img src="'+m.photo+'" class="miph">';}
      if(m.photoDesc){h+='<div style="font-size:10px;color:#555;margin-bottom:6px;font-style:italic">'+m.photoDesc+'</div>';}
      h+='<div class="mmacs">';
      var mdata=[["P",m.protein,"#e8322a"],["C",m.carbs,"#f59e0b"],["F",m.fat,"#3b82f6"],["kcal",m.calories,"#10b981"]];
      for(var mdi=0;mdi<mdata.length;mdi++){
        h+='<div class="mm"><div class="mmv" style="color:'+mdata[mdi][2]+'">'+mdata[mdi][1]+(mdata[mdi][0]!=="kcal"?"g":"")+'</div><div class="mml">'+mdata[mdi][0]+'</div></div>';
      }
      h+='</div></div>';
    }
    h+='</div>';
  }

  // ===== WORKOUT VIEW =====
  if(S.view==="workout"&&dayType!=="Rest"){
    var plan=WORKOUT_PLAN[DAYS[S.ad]];
    if(!plan){h+='<div style="text-align:center;color:#444;padding:40px 0">Rest day</div>';}
    else{
      var exDone=countExDone();
      var exTotal=countExTotal();
      var pct2=exTotal>0?exDone/exTotal:0;

      h+='<div class="wkt-hdr">';
      h+='<div><div style="font-size:9px;letter-spacing:3px;color:#444;text-transform:uppercase;margin-bottom:3px">'+DAYS[S.ad]+'</div>';
      h+='<div style="font-size:20px;font-weight:500;color:#f0ede8">'+plan.title+'</div>';
      h+='<div style="font-size:11px;color:#555;margin-top:2px">'+plan.subtitle+'</div></div>';
      h+='<div class="wkt-ring">';
      h+=mkRing(exDone,Math.max(exTotal,1),"#e8322a",52,4);
      h+='<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center">';
      h+='<div style="font-size:13px;font-weight:500;color:#f0ede8">'+exDone+'</div>';
      h+='<div style="font-size:7px;color:#555">of '+exTotal+'</div></div></div></div>';

      for(var sci=0;sci<plan.sections.length;sci++){
        var sec=plan.sections[sci];
        h+='<div style="font-size:9px;letter-spacing:3px;color:#444;text-transform:uppercase;margin-bottom:10px">'+sec.label+'</div>';
        for(var exi=0;exi<sec.exercises.length;exi++){
          var ex=sec.exercises[exi];
          var exst=getExState(ex.name);
          var isDone=exst.done;
          var isActive=exst.active&&!isDone;
          var cardClass="ex-card"+(isDone?" done":isActive?" prog":" todo");
          var hasFeedback=isDone||isActive;
          h+='<div class="'+cardClass+'">';
          h+='<div class="ex-row'+(hasFeedback?" has-feedback":"")+'">';
          h+='<div class="ex-info">';
          if(isDone){
            h+='<div class="ex-circle-done" onclick="toggleExDone(\''+ex.name+'\')"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></div>';
          }else if(isActive){
            h+='<div class="ex-circle-prog" onclick="toggleExDone(\''+ex.name+'\')"><div style="width:6px;height:6px;border-radius:50%;background:#f59e0b"></div></div>';
          }else{
            h+='<div class="ex-circle-todo" onclick="setExActive(\''+ex.name+'\')"></div>';
          }
          h+='<div><div class="ex-name">'+ex.name+'</div><div class="ex-sub">'+ex.detail+'</div></div>';
          h+='</div>';
          if(ex.url){
            h+='<button class="demo-btn'+(isActive?" active":"")+'" onclick="S.activeVideo=S.activeVideo===\''+ex.name+'\'?null:\''+ex.name+'\';draw()">&#9654; Demo</button>';
          }
          h+='</div>';

          // Video player inline
          if(S.activeVideo===ex.name&&ex.url){
            var vid=ex.url.replace("watch?v=","embed/");
            h+='<div class="video-wrap"><iframe width="100%" style="aspect-ratio:16/9;border:none;border-radius:8px;display:block" src="'+vid+'" allowfullscreen></iframe></div>';
          }

          if(hasFeedback){
            h+='<div class="ex-ratings">';
            for(var ei2=0;ei2<EMOJIS.length;ei2++){
              var em=EMOJIS[ei2];
              h+='<button class="erbtn'+(exst.rating===em?" sel":"")+'" onclick="setExercise(\''+DAYS[S.ad]+'\',\''+ex.name+'\',\'rating\',\''+(exst.rating===em?"":em)+'\')">'+em+'</button>';
            }
            h+='</div>';
            if(isActive){
              h+='<textarea class="ex-textarea" id="ex-note-'+exi+'" placeholder="How did it feel? Any weight adjustments, notes...">'+(exst.note||"")+'</textarea>';
            }else{
              h+='<div class="ex-note-display'+(exst.note?"":" ex-note-empty")+'" onclick="setExActive(\''+ex.name+'\')">'+(exst.note||"Tap to add a note...")+'</div>';
            }
          }
          h+='</div>';
        }
      }
    }
  }

  h+='</div>';
  document.getElementById("root").innerHTML=h;

  // Event listeners
  var ta=document.getElementById("meal-ta");
  if(ta){ta.addEventListener("input",function(e){S.mealText=e.target.value;});}

  var wn=document.getElementById("workout-notes");
  if(wn){wn.addEventListener("blur",function(e){setDay(function(d){var nd=JSON.parse(JSON.stringify(d));nd.workout.notes=e.target.value;return nd;});});}

  var wi3=document.getElementById("weight-input");
  if(wi3){wi3.addEventListener("blur",function(e){setDay(function(d){var nd=JSON.parse(JSON.stringify(d));nd.weight=e.target.value;return nd;});});}

  // Exercise note listeners
  if(S.view==="workout"&&WORKOUT_PLAN[DAYS[S.ad]]){
    var plan2=WORKOUT_PLAN[DAYS[S.ad]];
    for(var sci2=0;sci2<plan2.sections.length;sci2++){
      var sec2=plan2.sections[sci2];
      for(var exi2=0;exi2<sec2.exercises.length;exi2++){
        var ex2=sec2.exercises[exi2];
        var noteEl=document.getElementById("ex-note-"+exi2);
        if(noteEl){
          (function(exName){
            noteEl.addEventListener("blur",function(e){
              setExercise(DAYS[S.ad],exName,"note",e.target.value);
            });
          })(ex2.name);
        }
      }
    }
  }
}

lsLoad();
draw();
</script>
</body>
</html>
