<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Tracker">
<title>My Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0a0a0a;color:#ccc;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;max-width:480px;margin:0 auto;padding-bottom:100px;min-height:100vh;}
button,textarea,input{font-family:inherit;}
.hdr{padding:44px 20px 10px;background:#0d0d0d;border-bottom:1px solid #1c1c1c;position:sticky;top:0;z-index:100;}
.hlbl{font-size:9px;letter-spacing:3px;color:#e8322a;text-transform:uppercase;margin-bottom:2px;}
.hrow{display:flex;justify-content:space-between;align-items:center;}
.htitle{font-size:18px;font-weight:500;color:#f0ede8;}
.navb{display:flex;gap:5px;align-items:center;}
.nbtn{background:#181818;border:1px solid #252525;border-radius:6px;width:26px;height:26px;color:#888;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.wsbtn{background:transparent;border:1px solid #252525;border-radius:8px;padding:4px 10px;font-size:10px;color:#888;cursor:pointer;margin-left:4px;white-space:nowrap;}
.wsbtn.on{border-color:#e8322a;color:#e8322a;}
.sync-bar{display:flex;align-items:center;gap:6px;margin-top:6px;padding:6px 10px;background:#0c0c0c;border-radius:8px;border:1px solid #1a1a1a;}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sync-txt{font-size:10px;flex:1;}
.sync-btn{background:#1a1a1a;border:1px solid #252525;border-radius:6px;padding:3px 10px;font-size:10px;color:#888;cursor:pointer;white-space:nowrap;}
.tabs{display:flex;gap:5px;padding:10px 20px;overflow-x:auto;background:#0d0d0d;border-bottom:1px solid #1c1c1c;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;border-radius:10px;padding:6px 10px;text-align:center;border:1px solid #1c1c1c;background:#121212;cursor:pointer;}
.tab.on{background:#e8322a;border-color:#e8322a;}
.tab.rest{opacity:0.4;}
.tday{font-size:8px;letter-spacing:1px;color:#3a3a3a;text-transform:uppercase;margin-bottom:1px;}
.tab.on .tday{color:rgba(255,255,255,0.5);}
.ttype{font-size:10px;font-weight:500;color:#888;}
.tab.on .ttype{color:#fff;}
.tdone{font-size:7px;color:#e8322a;margin-top:2px;}
.tab.on .tdone{color:rgba(255,255,255,0.7);}
.vtog{display:flex;gap:6px;padding:12px 20px 0;}
.vbtn{background:transparent;border:1px solid #181818;border-radius:8px;padding:5px 14px;color:#3a3a3a;font-size:11px;cursor:pointer;}
.vbtn.on{background:#181818;border-color:#252525;color:#f0ede8;font-weight:500;}
.pg{padding:12px 20px 0;}
.card{background:#111;border:1px solid #1c1c1c;border-radius:14px;padding:16px;margin-bottom:12px;}
.slbl{font-size:9px;letter-spacing:3px;color:#444;text-transform:uppercase;margin-bottom:12px;}
.bar{margin-bottom:7px;}
.blr{display:flex;justify-content:space-between;font-size:10px;color:#555;margin-bottom:3px;}
.bt{background:#181818;border-radius:3px;height:4px;}
.bf{height:100%;border-radius:3px;}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.chip{background:#0c0c0c;border-radius:8px;padding:8px 4px;text-align:center;}
.cv{font-size:13px;font-weight:500;}
.cl{font-size:8px;color:#383838;margin-top:1px;}
.wseg{flex:1;height:6px;border-radius:3px;background:#181818;cursor:pointer;}
.wseg.on{background:#3b82f6;}
.addbtn{background:#e8322a;border:none;border-radius:8px;padding:5px 12px;color:#fff;font-size:11px;font-weight:500;cursor:pointer;}
.mta{width:100%;background:#111;border:1px solid #1c1c1c;border-radius:8px;color:#f0ede8;font-size:12px;padding:10px;resize:none;height:60px;margin-bottom:8px;display:block;}
.phbtn{width:100%;background:#111;border:1px dashed #252525;border-radius:8px;padding:10px 0;color:#444;font-size:12px;cursor:pointer;margin-bottom:10px;}
.cancelbtn{flex:1;background:transparent;border:1px solid #252525;border-radius:8px;color:#555;font-size:12px;padding:8px 0;cursor:pointer;}
.anlzbtn{flex:2;background:#e8322a;border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:500;padding:8px 0;cursor:pointer;}
.anlzbtn:disabled{background:#252525;opacity:0.5;}
.ex-card{border-radius:12px;padding:13px 14px;margin-bottom:8px;border:1px solid #1c1c1c;background:#111;}
.ex-card.done{border-left:3px solid #10b981;}
.ex-card.prog{border:1px solid #f59e0b;border-left:3px solid #f59e0b;}
.ex-card.todo{opacity:0.5;}
.ex-circle-done{width:20px;height:20px;border-radius:50%;background:#10b981;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
.ex-circle-prog{width:20px;height:20px;border-radius:50%;border:2px solid #f59e0b;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
.ex-circle-todo{width:20px;height:20px;border-radius:50%;border:1.5px solid #252525;flex-shrink:0;cursor:pointer;}
.demo-btn{background:#0c0c0c;border:1px solid #252525;border-radius:6px;padding:4px 8px;font-size:10px;color:#888;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.demo-btn.on{background:#f59e0b;border-color:#f59e0b;color:#000;font-weight:500;}
.erbtn{background:#0c0c0c;border:1px solid #252525;border-radius:6px;padding:5px 11px;font-size:11px;cursor:pointer;color:#888;}
.erbtn.sel{border-color:#10b981;background:#0a1a0f;color:#10b981;}
.ex-note{background:#0c0c0c;border:1px solid #1a1a1a;border-radius:8px;padding:8px 10px;font-size:12px;color:#555;cursor:pointer;margin-top:8px;}
.ex-note.has{color:#888;}
.ex-textarea{width:100%;background:#0c0c0c;border:1px solid #f59e0b;border-radius:8px;color:#f0ede8;font-size:12px;padding:8px 10px;resize:none;height:56px;display:block;margin-top:8px;}
.pgtoggle{background:transparent;border:1px solid #252525;border-radius:8px;padding:6px 14px;color:#555;font-size:11px;cursor:pointer;width:100%;margin:10px 0;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
.pslot{background:#0c0c0c;border:1px dashed #252525;border-radius:10px;aspect-ratio:3/4;position:relative;overflow:hidden;cursor:pointer;}
.pslot.has{border-style:solid;border-color:#1c1c1c;}
.pimg{width:100%;height:100%;object-fit:cover;display:block;}
.prem{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.75);border:none;border-radius:50%;width:24px;height:24px;color:#fff;font-size:11px;cursor:pointer;z-index:2;}
.ptyp{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:1px;text-transform:uppercase;}
.drow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #181818;cursor:pointer;}
.drow.rest{opacity:0.3;}
.wchart{display:flex;align-items:flex-end;gap:4px;height:56px;padding-top:8px;border-top:1px solid #181818;margin-top:12px;}
.wbarw{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.wbar{width:100%;border-radius:3px 3px 0 0;min-height:2px;}
.expbtn{width:100%;background:#e8322a;border:none;border-radius:8px;padding:10px 0;color:#fff;font-size:13px;font-weight:500;margin-top:12px;cursor:pointer;}
.expbtn:disabled{background:#252525;color:#555;}
.expbtn.done{background:#10b981;}
.arch-card{background:#111;border:1px solid #1c1c1c;border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;}
.arch-card.open{border-color:#e8322a;}
.wo-notes-textarea{width:100%;background:#0c0c0c;border:1px solid #252525;border-radius:8px;color:#f0ede8;font-size:12px;padding:8px 10px;resize:none;height:72px;display:block;}
.wo-notes-textarea:focus{outline:none;border-color:#444;}
.tg-fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:transparent;border:none;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center;transition:transform 0.15s ease;padding:0;}
.tg-fab:active{transform:scale(0.92);}
.tg-fab svg{width:48px;height:48px;animation:tg-glow 2.2s ease-in-out infinite;}
@keyframes tg-glow{0%,100%{filter:drop-shadow(0 0 4px rgba(232,50,42,0.3));}50%{filter:drop-shadow(0 0 12px rgba(232,50,42,0.95));}}
.tg-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;display:none;}
.tg-overlay.on{display:block;}
.tg-panel{position:fixed;left:0;right:0;bottom:0;top:5vh;background:#0a0a0a;z-index:301;border-radius:16px 16px 0 0;border-top:1px solid #1c1c1c;display:none;flex-direction:column;max-width:480px;margin:0 auto;}
.tg-panel.on{display:flex;}
.tg-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid #1c1c1c;flex-shrink:0;}
.tg-hdr-l{display:flex;align-items:center;gap:10px;}
.tg-hdr-icon{width:32px;height:32px;border-radius:50%;background:#e8322a;display:flex;align-items:center;justify-content:center;}
.tg-hdr-icon svg{width:22px;height:22px;}
.tg-hdr-name{font-size:14px;font-weight:600;color:#f0ede8;letter-spacing:0.5px;}
.tg-hdr-sub{font-size:9px;letter-spacing:2px;color:#444;text-transform:uppercase;margin-top:1px;}
.tg-close{background:#181818;border:1px solid #252525;border-radius:6px;width:28px;height:28px;color:#888;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.tg-msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.tg-msgs::-webkit-scrollbar{width:0;}
body.tg-locked{position:fixed;width:100%;overflow:hidden;}
.tg-empty{text-align:center;color:#3a3a3a;font-size:12px;padding:30px 10px;line-height:1.6;}
.tg-empty-title{color:#888;font-size:13px;margin-bottom:14px;}
.tg-quick{display:flex;flex-direction:column;gap:6px;margin-top:14px;}
.tg-qbtn{background:#0c0c0c;border:1px solid #1c1c1c;border-radius:10px;padding:10px 12px;color:#888;font-size:12px;text-align:left;cursor:pointer;font-family:inherit;}
.tg-qbtn:active{background:#141414;}
.tg-msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap;}
.tg-msg.me{align-self:flex-end;background:#e8322a;color:#fff;border-bottom-right-radius:4px;}
.tg-msg.tg{align-self:flex-start;background:#141414;color:#e0ddd8;border:1px solid #1c1c1c;border-bottom-left-radius:4px;}
.tg-msg.thinking{align-self:flex-start;background:#141414;color:#666;border:1px solid #1c1c1c;font-style:italic;font-size:12px;}
.tg-img-preview{align-self:flex-end;max-width:75%;border-radius:12px;border-bottom-right-radius:4px;overflow:hidden;border:1px solid rgba(232,50,42,0.3);}
.tg-img-preview img{width:100%;display:block;max-height:200px;object-fit:cover;}
.tg-photo-btn{background:transparent;border:none;color:#555;cursor:pointer;padding:0;width:36px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tg-photo-btn:active{color:#e8322a;}
.tg-photo-btn svg{width:20px;height:20px;}
.tg-meal-card{align-self:flex-start;background:#111;border:1px solid #e8322a;border-radius:14px;border-bottom-left-radius:4px;padding:14px;max-width:90%;width:100%;}
.tg-meal-card-title{font-size:9px;letter-spacing:2px;color:#e8322a;text-transform:uppercase;margin-bottom:8px;}
.tg-meal-card-name{font-size:14px;font-weight:500;color:#f0ede8;margin-bottom:10px;}
.tg-meal-card-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px;}
.tg-meal-macro{background:#0c0c0c;border-radius:6px;padding:6px 4px;text-align:center;}
.tg-meal-macro-val{font-size:13px;font-weight:500;color:#f0ede8;}
.tg-meal-macro-lbl{font-size:8px;color:#444;margin-top:1px;text-transform:uppercase;letter-spacing:1px;}
.tg-meal-btns{display:flex;gap:8px;}
.tg-meal-confirm{flex:1;background:#e8322a;border:none;border-radius:8px;padding:9px 0;color:#fff;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;}
.tg-meal-cancel{background:#1a1a1a;border:1px solid #252525;border-radius:8px;padding:9px 14px;color:#888;font-size:12px;cursor:pointer;font-family:inherit;}
.tg-input-row{display:flex;gap:8px;padding:12px 16px 18px;border-top:1px solid #1c1c1c;flex-shrink:0;background:#0a0a0a;}
.tg-input{flex:1;background:#0c0c0c;border:1px solid #252525;border-radius:18px;color:#f0ede8;font-size:13px;padding:10px 14px;font-family:inherit;resize:none;max-height:90px;min-height:40px;line-height:1.4;}
.tg-input:focus{outline:none;border-color:#444;}
.tg-send{background:#e8322a;border:none;border-radius:50%;width:40px;height:40px;color:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.tg-send:disabled{background:#252525;color:#555;cursor:not-allowed;}
.tg-send svg{width:18px;height:18px;}
.tg-clear{background:transparent;border:none;color:#3a3a3a;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:0;margin-right:10px;}
.goal-card{background:#111;border:1px solid #1c1c1c;border-radius:14px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;transition:background 0.6s ease;}
.goal-bar-track{background:#181818;border-radius:3px;height:5px;position:relative;overflow:hidden;}
.goal-bar-fill{height:100%;border-radius:3px;position:relative;overflow:hidden;}
.goal-bar-fill.shimmer::after{content:"";position:absolute;top:0;left:-50%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);animation:goal-shimmer 2.4s linear infinite;}
@keyframes goal-shimmer{0%{left:-50%;}100%{left:150%;}}
.goal-bar-fill.glow-green{box-shadow:0 0 8px rgba(16,185,129,0.5);}
.goal-bar-fill.locked-in{animation:goal-bar-locked 1.6s ease-in-out infinite;}
@keyframes goal-bar-locked{0%,100%{box-shadow:0 0 6px rgba(16,185,129,0.4);}50%{box-shadow:0 0 16px rgba(16,185,129,0.95);}}
.goal-lock{display:inline-block;transition:all 0.4s ease;}
.goal-lock.gl-1{animation:gl-pulse-1 5s ease-in-out infinite;filter:drop-shadow(0 0 2px rgba(232,50,42,0.4));}
.goal-lock.gl-2{animation:gl-pulse-2 4.5s ease-in-out infinite;filter:drop-shadow(0 0 4px rgba(232,50,42,0.55));}
.goal-lock.gl-3{animation:gl-pulse-3 4s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(232,50,42,0.65));}
.goal-lock.gl-4{animation:gl-pulse-4 3.4s ease-in-out infinite;filter:drop-shadow(0 0 7px rgba(232,50,42,0.7));}
.goal-lock.gl-5{animation:gl-pulse-5 3s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(232,50,42,0.75));}
.goal-lock.gl-6{animation:gl-pulse-6 2.6s ease-in-out infinite;filter:drop-shadow(0 0 9px rgba(232,50,42,0.8));}
.goal-lock.gl-7{animation:gl-pulse-7 2.3s ease-in-out infinite;filter:drop-shadow(0 0 11px rgba(232,50,42,0.85));}
.goal-lock.gl-8{animation:gl-pulse-8 2s ease-in-out infinite,gl-tremor 8s ease-in-out infinite;filter:drop-shadow(0 0 13px rgba(232,50,42,0.9));}
.goal-lock.gl-9{animation:gl-pulse-9 1.7s ease-in-out infinite,gl-tremor 5s ease-in-out infinite;filter:drop-shadow(0 0 15px rgba(232,50,42,0.95));}
.goal-lock.gl-10{animation:gl-pulse-10 1.4s ease-in-out infinite,gl-tremor 3s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(232,50,42,1));}
.goal-lock.gl-unlocked{animation:gl-unlocked-pulse 2s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(16,185,129,0.95));}
@keyframes gl-pulse-1{0%,100%{filter:drop-shadow(0 0 2px rgba(232,50,42,0.3));}50%{filter:drop-shadow(0 0 5px rgba(232,50,42,0.55));}}
@keyframes gl-pulse-2{0%,100%{filter:drop-shadow(0 0 3px rgba(232,50,42,0.4));}50%{filter:drop-shadow(0 0 7px rgba(232,50,42,0.7));}}
@keyframes gl-pulse-3{0%,100%{filter:drop-shadow(0 0 4px rgba(232,50,42,0.5));}50%{filter:drop-shadow(0 0 9px rgba(232,50,42,0.8));}}
@keyframes gl-pulse-4{0%,100%{filter:drop-shadow(0 0 5px rgba(232,50,42,0.55));}50%{filter:drop-shadow(0 0 11px rgba(232,50,42,0.85));}}
@keyframes gl-pulse-5{0%,100%{filter:drop-shadow(0 0 6px rgba(232,50,42,0.6));}50%{filter:drop-shadow(0 0 13px rgba(232,50,42,0.9));}}
@keyframes gl-pulse-6{0%,100%{filter:drop-shadow(0 0 7px rgba(232,50,42,0.65));}50%{filter:drop-shadow(0 0 14px rgba(232,50,42,0.95));}}
@keyframes gl-pulse-7{0%,100%{filter:drop-shadow(0 0 8px rgba(232,50,42,0.7));}50%{filter:drop-shadow(0 0 16px rgba(232,50,42,1));}}
@keyframes gl-pulse-8{0%,100%{filter:drop-shadow(0 0 9px rgba(232,50,42,0.75));}50%{filter:drop-shadow(0 0 18px rgba(232,50,42,1));}}
@keyframes gl-pulse-9{0%,100%{filter:drop-shadow(0 0 10px rgba(232,50,42,0.8));}50%{filter:drop-shadow(0 0 20px rgba(232,50,42,1));}}
@keyframes gl-pulse-10{0%,100%{filter:drop-shadow(0 0 12px rgba(232,50,42,0.85));}50%{filter:drop-shadow(0 0 24px rgba(232,50,42,1));}}
@keyframes gl-tremor{0%,93%,100%{transform:translateX(0) rotate(0deg);}94%{transform:translateX(-1px) rotate(-2deg);}95%{transform:translateX(1px) rotate(2deg);}96%{transform:translateX(-1px) rotate(-1deg);}97%{transform:translateX(1px) rotate(1deg);}98%{transform:translateX(0) rotate(0deg);}}
@keyframes gl-unlocked-pulse{0%,100%{filter:drop-shadow(0 0 12px rgba(16,185,129,0.7));}50%{filter:drop-shadow(0 0 22px rgba(16,185,129,1));}}
.goal-shoe{transition:filter 0.6s ease;}
.goal-shoe.aura-1{filter:drop-shadow(0 0 4px rgba(232,50,42,0.25));}
.goal-shoe.aura-2{filter:drop-shadow(0 0 6px rgba(232,50,42,0.35));animation:goal-shoe-breath 4s ease-in-out infinite;}
.goal-shoe.aura-3{filter:drop-shadow(0 0 9px rgba(232,50,42,0.5));animation:goal-shoe-breath 3.4s ease-in-out infinite;}
.goal-shoe.aura-4{filter:drop-shadow(0 0 12px rgba(232,50,42,0.65));animation:goal-shoe-breath 2.8s ease-in-out infinite;}
.goal-shoe.aura-5{filter:drop-shadow(0 0 18px rgba(232,50,42,0.8));animation:goal-shoe-breath 2.2s ease-in-out infinite;}
.goal-shoe.aura-earned{filter:drop-shadow(0 0 16px rgba(212,175,55,0.85));animation:goal-shoe-gold 3s ease-in-out infinite;}
@keyframes goal-shoe-breath{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
@keyframes goal-shoe-gold{0%,100%{filter:drop-shadow(0 0 12px rgba(212,175,55,0.7));}50%{filter:drop-shadow(0 0 24px rgba(212,175,55,1));}}
.goal-days-num{transition:color 0.6s ease;}
.goal-days-num.dn-1{animation:goal-days-pulse 4s ease-in-out infinite;}
.goal-days-num.dn-2{animation:goal-days-pulse 3s ease-in-out infinite;}
.goal-days-num.dn-3{animation:goal-days-flicker 0.15s steps(2,end) infinite,goal-days-pulse 2s ease-in-out infinite;}
@keyframes goal-days-pulse{0%,100%{opacity:0.95;text-shadow:0 0 4px rgba(232,50,42,0.4);}50%{opacity:1;text-shadow:0 0 12px rgba(232,50,42,0.85);}}
@keyframes goal-days-flicker{0%{opacity:1;}50%{opacity:0.7;}}
.goal-card.tier-warm{background:linear-gradient(180deg,#120e0e 0%,#111 100%);}
.goal-card.tier-hot{background:linear-gradient(180deg,#1a0c0c 0%,#120e0e 100%);}
.goal-card.tier-final{background:linear-gradient(180deg,#220e0e 0%,#160e0e 100%);}
.goal-card.tier-earned{background:linear-gradient(180deg,#0a1a0f 0%,#0e1612 100%);}
.goal-ember{position:absolute;bottom:-8px;width:3px;height:3px;border-radius:50%;background:#e8322a;opacity:0;pointer-events:none;}
.goal-ember.on{animation:goal-ember-rise 4s linear infinite;}
@keyframes goal-ember-rise{0%{bottom:-8px;opacity:0;transform:translateX(0);}10%{opacity:0.85;}90%{opacity:0.4;}100%{bottom:100%;opacity:0;transform:translateX(15px);}}
.goal-lightning{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(255,200,180,0.18),transparent 60%);opacity:0;pointer-events:none;border-radius:14px;}
.goal-lightning.on{animation:goal-lightning-flash 12s ease-in-out infinite;}
.goal-lightning.fast{animation:goal-lightning-flash 7s ease-in-out infinite;}
.goal-lightning.faster{animation:goal-lightning-flash 4s ease-in-out infinite;}
@keyframes goal-lightning-flash{0%,93%,100%{opacity:0;}94%{opacity:0.7;}95%{opacity:0.2;}96%{opacity:0.85;}97%{opacity:0;}}
.goal-pill{display:inline-block;background:#0a1a0f;border:1px solid #10b981;border-radius:10px;padding:2px 8px;font-size:8px;letter-spacing:1.5px;color:#10b981;text-transform:uppercase;margin-left:6px;animation:goal-pill-in 0.5s ease;font-weight:500;}
@keyframes goal-pill-in{0%{transform:scale(0.5);opacity:0;}80%{transform:scale(1.1);opacity:1;}100%{transform:scale(1);opacity:1;}}
.goal-earned-banner{background:linear-gradient(90deg,#0a1a0f 0%,#0e2018 100%);border:1px solid #10b981;border-radius:10px;padding:14px;text-align:center;margin-top:12px;animation:goal-banner-in 0.8s ease;position:relative;overflow:hidden;}
@keyframes goal-banner-in{0%{transform:translateY(-10px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
.goal-earned-banner::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(16,185,129,0.25),transparent);animation:goal-shimmer 3s linear infinite;}
.goal-buy-btn{display:inline-block;background:#e8322a;border:none;border-radius:8px;padding:8px 16px;color:#fff;font-size:12px;font-weight:600;text-decoration:none;margin-top:8px;animation:goal-buy-pulse 1.6s ease-in-out infinite;}
@keyframes goal-buy-pulse{0%,100%{box-shadow:0 0 8px rgba(232,50,42,0.5);transform:scale(1);}50%{box-shadow:0 0 18px rgba(232,50,42,0.95);transform:scale(1.03);}}
.goal-section-header{transition:color 0.6s ease;}
.goal-section-header.heat-2{color:#5a3a3a !important;}
.goal-section-header.heat-3{color:#8a4040 !important;}
.goal-section-header.heat-4{color:#a04030 !important;}
</style>

function executeSave(){
  var payload=JSON.stringify(AW);
  try{localStorage.setItem("mytracker",payload);}catch(e){}
  fetch(CLOUD_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"save",payload:payload})
  }).then(function(r){
    if(r.ok){
      S.syncStatus="saved";
      _lastSavedTs=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    }else{
      S.syncStatus="error";
    }
    updateSyncBar();
  }).catch(function(){
    S.syncStatus="error";
    updateSyncBar();
  });
}

  if(S.syncStatus==="saving"){

function isDayQualifiedWorkout(dayData,dayName){

  if(totalEx===0){return false;}
  var doneEx=0;

    for(var ki=0;ki<keys.length;ki++){if(dayData.exercises[keys[ki]].done){doneEx++;}}

  return doneEx/totalEx>0.5;

function calcGoalStats(){
  var now=new Date();
  var deadline=GOAL.deadline;
  var daysLeft=Math.max(0,Math.ceil((deadline-now)/86400000));
  var wkKeys=Object.keys(AW).map(Number).sort(function(a,b){return a-b;});
  var qualWorkoutWeeks=0;
  var qualProteinWeeks=0;
  var qualWaterWeeks=0;
  var weightHitGoal=false;
  var lowestWeight=999;
  for(var wki=0;wki<wkKeys.length;wki++){
    var wkKey=wkKeys[wki];
    // Hard floor: only count weeks at or after May 3, 2026
    if(wkKey<GOAL.epochTs)continue;
    var wkData=AW[wkKey];
    if(!Array.isArray(wkData))continue;
    var qualDays=0;
    var proteinDaysHit=0;
    var waterDaysHit=0;
    for(var di=0;di<7;di++){
      var d=wkData[di];
      var dn=DAYS[di];
      if(isDayQualifiedWorkout(d,dn)){qualDays++;}
      if(d.p>=PG){proteinDaysHit++;}
      if(d.water>=WG){waterDaysHit++;}
      if(d.weight&&parseFloat(d.weight)>0){
        var w=parseFloat(d.weight);
        if(w<lowestWeight){lowestWeight=w;}
        if(w<=GOAL.targetWeight){weightHitGoal=true;}
      }
    }
    if(qualDays>=GOAL.workoutDaysPerWeek){qualWorkoutWeeks++;}
    if(proteinDaysHit>=GOAL.proteinDaysPerWeek){qualProteinWeeks++;}
    if(waterDaysHit>=GOAL.waterDaysPerWeek){qualWaterWeeks++;}
  }
  var workoutPct=Math.min(100,Math.round((qualWorkoutWeeks/GOAL.targetWeeks)*100));
  var proteinPct=Math.min(100,Math.round((qualProteinWeeks/GOAL.targetWeeks)*100));
  var waterPct=Math.min(100,Math.round((qualWaterWeeks/GOAL.targetWeeks)*100));
  var currentWeight=lowestWeight===999?150.2:lowestWeight;
  var weightStart=150.2;
  var weightDrop=weightStart-GOAL.targetWeight;
  var weightProgress=Math.max(0,Math.min(100,Math.round(((weightStart-currentWeight)/weightDrop)*100)));
  var savStart=GOAL.savingsStartDate;
  var weeksElapsed=Math.max(0,Math.floor((now-savStart)/604800000));
  var savedNow=weeksElapsed*GOAL.savingsWeekly;
  var savingsPct=Math.min(100,Math.round((savedNow/GOAL.shoePriceWithTax)*100));
  var weeksNeeded=Math.ceil(GOAL.shoePriceWithTax/GOAL.savingsWeekly);
  var affordDate=new Date(savStart.getTime()+weeksNeeded*604800000);
  var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var affordStr=mo[affordDate.getMonth()]+" "+affordDate.getDate();
  var allUnlocked=qualWorkoutWeeks>=GOAL.targetWeeks&&qualProteinWeeks>=GOAL.targetWeeks&&qualWaterWeeks>=GOAL.targetWeeks&&weightHitGoal;
  // Overall progress percentage (drives all flashy escalation)
  // Each criterion contributes 25% max, so we cap and average
  var wktContrib=Math.min(GOAL.targetWeeks,qualWorkoutWeeks)/GOAL.targetWeeks;
  var pContrib=Math.min(GOAL.targetWeeks,qualProteinWeeks)/GOAL.targetWeeks;
  var watContrib=Math.min(GOAL.targetWeeks,qualWaterWeeks)/GOAL.targetWeeks;
  var wtContrib=weightHitGoal?1:Math.max(0,Math.min(1,(weightStart-currentWeight)/weightDrop));
  var overallPct=Math.round(((wktContrib+pContrib+watContrib+wtContrib)/4)*100);
  // weeksDone = floor of overall, used to drive the weekly tier
  var weeksDone=Math.floor((overallPct/100)*GOAL.targetWeeks);
  return{
    daysLeft:daysLeft,
    qualWorkoutWeeks:qualWorkoutWeeks,
    qualProteinWeeks:qualProteinWeeks,
    qualWaterWeeks:qualWaterWeeks,
    workoutPct:workoutPct,
    proteinPct:proteinPct,
    waterPct:waterPct,
    weightHitGoal:weightHitGoal,
    currentWeight:currentWeight,
    weightProgress:weightProgress,
    savedNow:savedNow,
    savingsPct:savingsPct,
    affordStr:affordStr,
    allUnlocked:allUnlocked,
    overallPct:overallPct,
    weeksDone:weeksDone
  };
}

      var cv=document.createElement("canvas");
      var mx=400,w=img.width,h=img.height;
      if(w>mx||h>mx){if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}
      cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      var comp=cv.toDataURL("image/jpeg",0.4);
      sday(function(d){if(side==="front"){d.photoFront=comp;}else{d.photoSide=comp;}return d;});
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
}

  S.ld=true;S.ae="";draw();
  var content=[];
  if(S.mp){content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:S.mp}});}
  var prompt=S.mp
    ?"Analyze this food photo"+(S.mt?" plus: "+S.mt:"")+". Return ONLY raw JSON no markdown: {\"name\":\"meal name\",\"protein\":25,\"carbs\":30,\"fat\":10,\"calories\":300}"
    :"Analyze: "+S.mt+". Return ONLY raw JSON no markdown: {\"name\":\"meal name\",\"protein\":25,\"carbs\":30,\"fat\":10,\"calories\":300}";

function doExport(wo){
  S.exporting=true;draw();
  var wk=gw(wo);
  var photos=[];
  for(var di=0;di<7;di++){
    var d=wk[di];
    if(d.photoFront){photos.push({di:di,side:"front",data:d.photoFront.split(",")[1]});}
    if(d.photoSide){photos.push({di:di,side:"side",data:d.photoSide.split(",")[1]});}
    if(d.cardioPhoto){photos.push({di:di,side:"cardio",data:d.cardioPhoto.split(",")[1]});}
    if(d.workout&&d.workout.notePhoto){photos.push({di:di,side:"wonote",data:d.workout.notePhoto.split(",")[1]});}
    if(d.meals){for(var mi=0;mi<d.meals.length;mi++){if(d.meals[mi].photo){photos.push({di:di,mi:mi,data:d.meals[mi].photo.split(",")[1]});}}}
  }
  var totalP=0,wkts=0,pdays=0,wts=[];
  for(var di=0;di<7;di++){
    var d=wk[di];totalP+=d.p;
    if(d.workout&&d.workout.completed){wkts++;}
    if(d.p>=PG){pdays++;}
    if(d.weight){wts.push(parseFloat(d.weight));}
  }
  var avgP=Math.round(totalP/7);
  var lwts=wts.filter(function(w){return w>0;});
  var avgWt=lwts.length?(lwts.reduce(function(a,b){return a+b;},0)/lwts.length).toFixed(1):"--";
  var lines=["WEEKLY CHECK-IN - "+wlbl(wo),
    "Workouts: "+wkts+"/5",
    "Avg protein: "+avgP+"g (goal: "+PG+"g)",
    "Protein days: "+pdays+"/7",
    "Avg weight: "+avgWt+" lbs"];
  var exFb=[];
  for(var di=0;di<7;di++){
    var d=wk[di];
    if(d.workout&&d.workout.notes){exFb.push(DAYS[di]+" (day notes): "+d.workout.notes);}
    if(d.exercises){
      var eks=Object.keys(d.exercises);
      for(var eki=0;eki<eks.length;eki++){
        var ex=d.exercises[eks[eki]];
        if(ex.rating||ex.note){exFb.push(DAYS[di]+" "+eks[eki]+": "+(ex.rating||"")+(ex.note?" - "+ex.note:""));}
      }
    }
  }
  if(exFb.length){lines.push("Workout notes + exercise feedback:");for(var fi=0;fi<exFb.length;fi++){lines.push("  "+exFb[fi]);}}
  var txt=lines.join("\n");
  if(photos.length===0){finishExport(wo,txt,{});return;}
  var descs={},pending=photos.length;
  function analyzePhoto(item){
    var content=[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:item.data}},
      {type:"text",text:"This is a fitness progress tracking photo. "+(item.side==="cardio"||item.side==="wonote"?"Treadmill/workout screen - summarize visible numbers in one sentence.":item.side?"Bodyweight progress photo ("+item.side+" view) - describe physique in one sentence.":"Food photo - describe food and portion in one sentence.")}];
    callAPI([{role:"user",content:content}],150,function(err,dtxt){
      var key=item.di+(item.side?"-"+item.side:"-meal"+item.mi);
      descs[key]=dtxt||"Photo logged";
      pending--;
      if(pending===0){finishExport(wo,txt,descs);}
    });
  }
  for(var pi=0;pi<photos.length;pi++){analyzePhoto(photos[pi]);}
}

  var wk=gw(wo);
  for(var di=0;di<7;di++){
    var d=wk[di];
    if(d.photoFront){d.photoFrontDesc=descs[di+"-front"]||"Front progress photo";d.photoFront=null;}
    if(d.photoSide){d.photoSideDesc=descs[di+"-side"]||"Side progress photo";d.photoSide=null;}
    if(d.cardioPhoto){d.cardioPhotoDesc=descs[di+"-cardio"]||"Treadmill screen logged";d.cardioPhoto=null;}
    if(d.workout&&d.workout.notePhoto){d.workout.notePhotoDesc=descs[di+"-wonote"]||"Workout note photo";d.workout.notePhoto=null;}
    if(d.meals){for(var mi=0;mi<d.meals.length;mi++){if(d.meals[mi].photo){d.meals[mi].photoDesc=descs[di+"-meal"+mi]||"Food photo";d.meals[mi].photo=null;}}}
  }
  AW[wkKey(wo)]=wk;
  scheduleSave();

  }).catch(function(){
    S.exporting=false;S.expDone=true;draw();
    setTimeout(function(){S.expDone=false;draw();},3000);
  });
}

function isDayEmpty(d){
  if(!d){return true;}
  if(d.meals&&d.meals.length){return false;}
  if(d.water){return false;}
  if(d.weight){return false;}
  if(d.workout&&(d.workout.completed||d.workout.rating||d.workout.notes||d.workout.notePhoto||d.workout.notePhotoDesc)){return false;}
  if(d.exercises&&Object.keys(d.exercises).length){return false;}
  if(d.photoFront||d.photoSide||d.cardioPhoto||d.photoFrontDesc||d.photoSideDesc||d.cardioPhotoDesc){return false;}
  return true;
}

function migrateToDateKeys(){
  if(localStorage.getItem("mytracker_migrated_to_date_keys_v1")==="done"){return;}
  localStorage.setItem("mytracker_migrated_to_date_keys_v1","done");
  var oldKeys=Object.keys(AW);
  var migrated={};
  var didMigrate=false;
  for(var ki=0;ki<oldKeys.length;ki++){
    var ok=oldKeys[ki];
    var n=Number(ok);
    if(!isFinite(n)){didMigrate=true;continue;}
    var data=AW[ok];
    if(Math.abs(n)>1e6){migrated[ok]=data;continue;}
    var empty=true;
    if(Array.isArray(data)){for(var di=0;di<data.length;di++){if(!isDayEmpty(data[di])){empty=false;break;}}}
    if(empty){didMigrate=true;continue;}
    var newKey=WS-(n+1)*604800000;
    migrated[newKey]=data;
    didMigrate=true;
  }
  AW=migrated;
  if(didMigrate){scheduleSave();}
}

function tgCtx(){
  var now=new Date();
  var dn=DAYS[now.getDay()];
  var dtype=DTYPES[dn];
  var todayWk=gw(0);
  var today=todayWk[now.getDay()];
  var lines=[];
  lines.push("USER: Vinny. Goal: fat loss, lean physique. Vegas trip near-term. LV Trainers by Dec 1 year-end goal.");
  lines.push("DAILY TARGETS: "+PG+"g protein, "+CG+" cal, "+WG+" glasses water.");
  lines.push("SPLIT: 5:15am, Mon Upper A, Tue Lower+Abs, Wed Cardio, Thu Upper B, Fri Lower+Abs, Sat/Sun rest.");
  lines.push("");
  lines.push("=== TODAY ("+dn+", "+dtype+") ===");
  if(today.weight){lines.push("Weight: "+today.weight+" lbs");}
  lines.push("Protein: "+today.p+"g / "+PG+"g ("+(PG-today.p>0?(PG-today.p)+"g remaining":"target hit")+")");
  lines.push("Calories: "+today.cal+" / "+CG);
  lines.push("Carbs: "+today.carbs+"g, Fat: "+today.fat+"g");
  lines.push("Water: "+today.water+"/"+WG+" glasses");
  if(today.meals.length){
    lines.push("Meals logged today:");
    for(var i=0;i<today.meals.length;i++){
      var m=today.meals[i];
      lines.push("  - "+m.name+" ("+m.protein+"g P, "+m.carbs+"g C, "+m.fat+"g F, "+m.calories+" cal)");
    }
  }else{
    lines.push("No meals logged yet today.");
  }
  if(dtype!=="Rest"&&today.workout){
    lines.push("Workout: "+(today.workout.completed?"COMPLETED ("+today.workout.rating+")":"not yet completed"));
    if(today.workout.notes){lines.push("Workout notes: "+today.workout.notes);}
  }
  lines.push("");
  lines.push("=== THIS WEEK ===");
  var wkts=0,pSum=0,pDays=0,wts=[];
  for(var di=0;di<7;di++){
    var wd=todayWk[di];
    if(wd.workout&&wd.workout.completed){wkts++;}
    if(wd.p>0){pSum+=wd.p;pDays++;}
    if(wd.weight){wts.push(parseFloat(wd.weight));}
  }
  lines.push("Workouts completed: "+wkts+"/5");
  lines.push("Avg protein (logged days): "+(pDays?Math.round(pSum/pDays):0)+"g");
  if(wts.length){
    var avgWt=wts.reduce(function(a,b){return a+b;},0)/wts.length;
    lines.push("Weight range: "+Math.min.apply(null,wts).toFixed(1)+"-"+Math.max.apply(null,wts).toFixed(1)+" lbs (avg "+avgWt.toFixed(1)+")");
  }
  var lastWk=gw(-1);
  var lastWts=[];for(var li=0;li<7;li++){if(lastWk[li].weight){lastWts.push(parseFloat(lastWk[li].weight));}}
  if(lastWts.length&&wts.length){
    var lastAvg=lastWts.reduce(function(a,b){return a+b;},0)/lastWts.length;
    var thisAvg=wts.reduce(function(a,b){return a+b;},0)/wts.length;
    var delta=(thisAvg-lastAvg).toFixed(1);
    lines.push("Weight delta vs last week: "+(delta>0?"+":"")+delta+" lbs");
  }
  var gs=calcGoalStats();
  lines.push("");
  lines.push("=== LV TRAINER GOAL (tracking starts May 3, 2026) ===");
  lines.push("Qualifying workout weeks: "+gs.qualWorkoutWeeks+"/20");
  lines.push("Qualifying protein weeks: "+gs.qualProteinWeeks+"/20");
  lines.push("Qualifying water weeks: "+gs.qualWaterWeeks+"/20");
  lines.push("Weight goal: "+(gs.weightHitGoal?"HIT":""+gs.currentWeight+" lbs, need 140"));
  lines.push("Savings: $"+gs.savedNow+" of $1,675 target ("+gs.affordStr+" ready)");
  lines.push("Overall progress: "+gs.overallPct+"% (week "+gs.weeksDone+" of 20)");
  return lines.join("\n");
}

function tgPhotoChosen(input){
  var f=input.files&&input.files[0];
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement("canvas");
      var mx=800,w=img.width,h=img.height;
      if(w>mx||h>mx){if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}
      cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
      var comp=cv.toDataURL("image/jpeg",0.7);
      S.tgPhoto=comp;S.tgPhotoData=comp.split(",")[1];
      var btn=document.querySelector(".tg-photo-btn");
      if(btn){btn.style.color="#e8322a";}
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
  input.value="";
}

  S.tgChat.push({role:"assistant",content:"No worries, not logged."});
  tgRender();
}

function tgSend(){
  if(S.tgBusy)return;
  var inp=document.getElementById("tg-input");
  var txt=(inp&&inp.value||"").trim();
  var hasPhoto=!!S.tgPhotoData;
  if(!txt&&!hasPhoto)return;
  inp.value="";inp.style.height="40px";
  var userContent=txt||(hasPhoto?"(photo)":"");
  var apiContent=[];
  if(hasPhoto){apiContent.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:S.tgPhotoData}});}
  if(txt){apiContent.push({type:"text",text:txt});}
  else{apiContent.push({type:"text",text:"Analyze this image in the context of my fitness goals."});}
  S.tgChat.push({role:"user",content:userContent,photo:S.tgPhoto});
  S.tgChat.push({role:"assistant",content:"thinking...",thinking:true});
  S.tgBusy=true;
  var sendBtn=document.getElementById("tg-send");
  if(sendBtn){sendBtn.disabled=true;}
  tgClearPhoto();
  tgRender();
  var msgs=[];
  for(var i=0;i<S.tgChat.length-1;i++){
    var m=S.tgChat[i];
    if(m.role==="meal-confirm")continue;
    if(m.role==="user"){
      if(m.photo){
        msgs.push({role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:m.photo.split(",")[1]}},{type:"text",text:m.content&&m.content!=="(photo)"?m.content:"Analyze this image in the context of my fitness goals."}]});
      }else{
        msgs.push({role:"user",content:m.content});
      }
    }else if(m.role==="assistant"){
      msgs.push({role:"assistant",content:m.content});
    }
  }
  msgs[msgs.length-1]={role:"user",content:apiContent};
  var isLogRequest=TG_LOG_RX.test(txt)&&TG_FOOD_RX.test(txt);
  var sysPrompt=tgSysPrompt();
  if(isLogRequest){
    sysPrompt+="\n\nIMPORTANT: User wants to log a meal. After your response, if you can identify macros, append exactly:\n[MEAL_LOG]{\"name\":\"Meal name\",\"protein\":25,\"carbs\":30,\"fat\":10,\"calories\":300}[/MEAL_LOG]\nOnly include if confident. No text after the block.";
  }
  var body={model:"claude-sonnet-4-20250514",max_tokens:1024,system:sysPrompt,messages:msgs};
  if(TG_FOOD_RX.test(txt)||hasPhoto){
    body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:2}];
  }
  fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
  }).then(function(r){return r.json();}).then(function(data){
    var reply="";
    if(data.content&&data.content.length){
      for(var ci=0;ci<data.content.length;ci++){
        var blk=data.content[ci];
        if(blk.type==="text"&&blk.text){reply+=blk.text;}
      }
    }
    if(!reply){reply=data.error?("Error: "+(data.error.message||"unknown")):"No response. Try again.";}
    var mealMatch=reply.match(/\[MEAL_LOG\]([\s\S]*?)\[\/MEAL_LOG\]/);
    var cleanReply=reply.replace(/\[MEAL_LOG\][\s\S]*?\[\/MEAL_LOG\]/,"").trim();
    S.tgChat.pop();
    S.tgChat.push({role:"assistant",content:cleanReply});
    if(mealMatch){
      try{var mealData=JSON.parse(mealMatch[1].trim());tgShowMealConfirm(mealData);}catch(e){}
    }
    S.tgBusy=false;
    if(sendBtn){sendBtn.disabled=false;}
    tgRender();
  }).catch(function(){
    S.tgChat.pop();
    S.tgChat.push({role:"assistant",content:"Couldn't reach the server. Check your connection and try again."});
    S.tgBusy=false;
    if(sendBtn){sendBtn.disabled=false;}
    tgRender();
  });
}

(function(){
  var now=new Date();
  S.ad=now.getDay();
  S.wo=0;
  S.view="log";
})();

load();
</script>
