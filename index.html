<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0a0a0a;color:#ccc;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;max-width:480px;margin:0 auto;padding-bottom:100px;min-height:100vh;}
button,textarea,input{font-family:inherit;}
#root{min-height:100vh;}
.hdr{padding:44px 20px 12px;background:#0d0d0d;border-bottom:1px solid #1c1c1c;position:sticky;top:0;z-index:100;}
.hlbl{font-size:9px;letter-spacing:3px;color:#e8322a;text-transform:uppercase;margin-bottom:2px;}

.ttype{font-size:10px;font-weight:600;color:#888;}
.tab.on .ttype{color:#fff;}

.tab.on .tdone{color:rgba(255,255,255,0.7);}
.vtog{display:flex;gap:6px;padding:12px 20px 0;}
.vbtn{background:transparent;border:1px solid #181818;border-radius:8px;padding:5px 14px;color:#3a3a3a;font-size:11px;cursor:pointer;}

.picon{font-size:22px;margin-bottom:6px;}
.plbl{font-size:10px;color:#444;text-align:center;}
.pimg{width:100%;height:100%;object-fit:cover;display:block;}
.prem{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.75);border:none;border-radius:50%;width:24px;height:24px;color:#fff;font-size:11px;cursor:pointer;z-index:2;}
.ptyp{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:1px;text-transform:uppercase;}
.mring{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
.rw{position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ri{position:absolute;text-align:center;pointer-events:none;}
.rv{font-size:12px;font-weight:700;color:#f0ede8;}
.rs{font-size:7px;color:#444;}
.bar{margin-bottom:7px;}
.blr{display:flex;justify-content:space-between;font-size:10px;color:#555;margin-bottom:3px;}
.blrv{color:#999;}
.bt{background:#181818;border-radius:3px;height:4px;}
.bf{height:100%;border-radius:3px;}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.chip{background:#0c0c0c;border-radius:8px;padding:8px 4px;text-align:center;}
.cv{font-size:13px;font-weight:700;}
.cl{font-size:8px;color:#383838;margin-top:1px;}
.wtrrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.wtrval{font-size:16px;font-weight:700;color:#3b82f6;}
.wtrbtns{display:flex;gap:6px;}
.wtrbtn{border-radius:8px;width:32px;height:32px;font-size:16px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.wtrm{background:#181818;border:1px solid #252525;color:#888;}
.wtrp{background:#3b82f6;color:#fff;}
.wsegs{display:flex;gap:4px;}
.wseg{flex:1;height:6px;border-radius:3px;background:#181818;cursor:pointer;}
.wseg.on{background:#3b82f6;}
.mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.addbtn{background:#e8322a;border:none;border-radius:8px;padding:5px 12px;color:#fff;font-size:11px;font-weight:600;cursor:pointer;}
.mform{background:#0c0c0c;border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid #1a1a1a;}
.mhint{font-size:11px;color:#555;margin-bottom:10px;}
.phbtn{width:100%;background:#111;border:1px dashed #252525;border-radius:8px;padding:10px 0;color:#444;font-size:12px;cursor:pointer;margin-bottom:10px;}
.pvw{position:relative;margin-bottom:10px;}
.pvwimg{width:100%;max-height:150px;object-fit:cover;border-radius:8px;display:block;}
.pvrm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.75);border:none;border-radius:50%;width:24px;height:24px;color:#fff;font-size:12px;cursor:pointer;}
.pvbdg{position:absolute;bottom:6px;left:8px;background:#10b981;border-radius:4px;padding:2px 8px;font-size:9px;color:#fff;}
.mta{width:100%;background:#111;border:1px solid #1c1c1c;border-radius:8px;color:#f0ede8;font-size:12px;padding:10px;resize:none;height:60px;margin-bottom:8px;display:block;}
.aerr{color:#e8322a;font-size:11px;margin-bottom:8px;}
.fbtns{display:flex;gap:8px;}
.cancelbtn{flex:1;background:transparent;border:1px solid #252525;border-radius:8px;color:#555;font-size:12px;padding:8px 0;cursor:pointer;}
.anlzbtn{flex:2;background:#e8322a;border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;padding:8px 0;cursor:pointer;}
.anlzbtn:disabled{background:#252525;opacity:0.5;}
.nomeal{text-align:center;color:#2a2a2a;font-size:12px;padding:14px 0;}
.mi{background:#0c0c0c;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #181818;}
.mihdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.miname{font-size:13px;color:#f0ede8;font-weight:500;}
.midesc{font-size:10px;color:#3a3a3a;margin-top:1px;}
.mirm{background:none;border:none;color:#2a2a2a;font-size:13px;padding:0;margin-left:8px;cursor:pointer;}
.miph{width:100%;max-height:90px;object-fit:cover;border-radius:6px;margin-bottom:8px;display:block;}
.mmacs{display:flex;gap:5px;}
.mm{background:#141414;border-radius:6px;padding:4px 7px;text-align:center;}
.mmv{font-size:12px;font-weight:700;}
.mml{font-size:8px;color:#383838;}
.woutbtn{width:100%;border-radius:10px;padding:10px 0;color:#fff;font-size:13px;font-weight:600;margin-bottom:10px;border:1px solid #252525;background:#141414;cursor:pointer;}
.woutbtn.done{background:#e8322a;border-color:#e8322a;}
.rhint{font-size:10px;color:#444;margin-bottom:8px;}
.rrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.rbtn{background:transparent;border:1px solid #1e1e1e;border-radius:8px;padding:5px 9px;color:#444;font-size:11px;cursor:pointer;}
.rbtn.on{background:#1c1c1c;border-color:#e8322a;color:#f0ede8;}
.wnotes{width:100%;background:#0c0c0c;border:1px solid #181818;border-radius:8px;color:#ccc;font-size:12px;padding:10px;resize:none;height:60px;}
.wkstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.wkstat{background:#111;border:1px solid #1c1c1c;border-radius:12px;padding:12px 8px;text-align:center;}
.wksv{font-size:18px;font-weight:700;}
.wkss{font-size:9px;color:#3a3a3a;margin-top:2px;}
.wksl{font-size:9px;color:#2a2a2a;margin-top:1px;}
.drow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #181818;cursor:pointer;}
.drow.rest{opacity:0.3;}
.dname{font-size:12px;font-weight:600;color:#f0ede8;}
.dtype{color:#383838;font-weight:400;font-size:10px;}
.dsub{font-size:10px;color:#3a3a3a;margin-top:1px;}
.dright{text-align:right;}
.dprot{font-size:13px;font-weight:700;}
.dcal{font-size:9px;color:#383838;}
.dwt{font-size:10px;color:#f59e0b;margin-top:1px;}
.dtrn{font-size:8px;color:#e8322a;margin-top:1px;}
.wchart{display:flex;align-items:flex-end;gap:4px;height:56px;padding-top:8px;border-top:1px solid #181818;margin-top:12px;}
.wbarw{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.wbar{width:100%;border-radius:3px 3px 0 0;min-height:2px;}
.wbard{font-size:7px;color:#3a3a3a;}
.wbarv{font-size:7px;color:#f59e0b;}
.cbox{background:#0c0c0c;border-radius:10px;padding:12px;font-size:11px;color:#666;line-height:2;border:1px solid #181818;font-family:monospace;word-break:break-word;}
.ctitle{color:#e8322a;font-weight:600;margin-bottom:4px;}
.cnote{padding-left:8px;color:#4a4a4a;}
.cpbtn{width:100%;background:#181818;border:1px solid #252525;border-radius:8px;padding:8px 0;color:#888;font-size:12px;margin-top:10px;cursor:pointer;}
.cpbtn.ok{color:#10b981;border-color:#10b981;}
</style>
</head>
<body>
<div id="root"><div style="color:#e8322a;padding:40px 20px;font-size:14px;">Starting up...</div></div>
<script>
var PG=140,CG=1900,WG=10;
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DT={"Sun":"Rest","Mon":"Upper A","Tue":"Lower+Abs","Wed":"Cardio","Thu":"Upper B","Fri":"Lower+Abs","Sat":"Rest"};
var RT=["💀 Brutal","🔥 Hard","✅ Solid","😐 Okay","😴 Easy"];
var WS=new Date(2026,2,22).getTime();
var AW={};
var S={wo:0,ad:0,view:"log",smf:false,mt:"",mp:null,mpp:null,ld:false,ae:"",cp:false};

function wlbl(o){
var s=new Date(WS+o*7*86400000);
var e=new Date(WS+o*7*86400000+6*86400000);
var mo=[“Jan”,“Feb”,“Mar”,“Apr”,“May”,“Jun”,“Jul”,“Aug”,“Sep”,“Oct”,“Nov”,“Dec”];
return mo[s.getMonth()]+” “+s.getDate()+” - “+mo[e.getMonth()]+” “+e.getDate();
}

function ed(){
return{meals:[],water:0,weight:””,photoFront:null,photoSide:null,
workout:{completed:false,rating:””,notes:””},
totalProtein:0,totalCalories:0,totalCarbs:0,totalFat:0};
}
function ew(){
return[ed(),ed(),ed(),ed(),ed(),ed(),ed()];
}

function lsLoad(){
try{
var d=localStorage.getItem(“trk5”);
if(d)AW=JSON.parse(d);
}catch(e){}
}
function lsSave(){
try{localStorage.setItem(“trk5”,JSON.stringify(AW));}catch(e){}
}

function gw(o){
if(!AW[o])AW[o]=ew();
return AW[o];
}

function upd(di,fn){
var wo=S.wo;
var wk=gw(wo);
var d=fn(wk[di]);
wk[di]=d;
AW[wo]=wk;
lsSave();
render();
}

function setS(key,val){S[key]=val;render();}

function hph(e,type){
var f=e.target.files[0];
if(!f)return;
var r=new FileReader();
r.onload=function(){
upd(S.ad,function(d){
var nd=copyDay(d);
if(type===“front”)nd.photoFront=r.result;
else nd.photoSide=r.result;
return nd;
});
};
r.readAsDataURL(f);
}
function rph(type){
upd(S.ad,function(d){
var nd=copyDay(d);
if(type===“front”)nd.photoFront=null;
else nd.photoSide=null;
return nd;
});
}
function hmph(e){
var f=e.target.files[0];
if(!f)return;
var r=new FileReader();
r.onload=function(){
S.mp=r.result.split(”,”)[1];
S.mpp=r.result;
render();
};
r.readAsDataURL(f);
}

function copyDay(d){
return{meals:d.meals.slice(),water:d.water,weight:d.weight,
photoFront:d.photoFront,photoSide:d.photoSide,
workout:{completed:d.workout.completed,rating:d.workout.rating,notes:d.workout.notes},
totalProtein:d.totalProtein,totalCalories:d.totalCalories,
totalCarbs:d.totalCarbs,totalFat:d.totalFat};
}

function analyze(){
var ta=document.getElementById(“mta”);
if(ta)S.mt=ta.value;
if(!S.mt&&!S.mp)return;
S.ld=true;S.ae=””;render();
var content=[];
if(S.mp){
content.push({type:“image”,source:{type:“base64”,media_type:“image/jpeg”,data:S.mp}});
}
var prompt=S.mp
?“Analyze this food photo”+(S.mt?” plus description: "”+S.mt+”"”:””)+”. Return ONLY raw JSON no markdown: {"name":"short name","protein":0,"carbs":0,"fat":0,"calories":0}. Fill in realistic numbers.”
:“Analyze this meal: "”+S.mt+”". Return ONLY raw JSON no markdown: {"name":"short name","protein":0,"carbs":0,"fat":0,"calories":0}. Fill in realistic standard portion numbers.”;
content.push({type:“text”,text:prompt});
fetch(“https://api.anthropic.com/v1/messages”,{
method:“POST”,
headers:{“Content-Type”:“application/json”},
body:JSON.stringify({model:“claude-sonnet-4-20250514”,max_tokens:500,messages:[{role:“user”,content:content}]})
}).then(function(res){return res.json();}).then(function(data){
var txt=””;
if(data.content){
for(var i=0;i<data.content.length;i++){
if(data.content[i].type===“text”){txt=data.content[i].text;break;}
}
}
txt=txt.replace(/`json/g,"").replace(/`/g,””).trim();
var p=JSON.parse(txt);
var preview=S.mpp,input=S.mt;
upd(S.ad,function(d){
var nd=copyDay(d);
nd.meals=d.meals.concat([{name:p.name,protein:p.protein,carbs:p.carbs,fat:p.fat,calories:p.calories,input:input,photoPreview:preview}]);
nd.totalProtein=d.totalProtein+(p.protein||0);
nd.totalCalories=d.totalCalories+(p.calories||0);
nd.totalCarbs=d.totalCarbs+(p.carbs||0);
nd.totalFat=d.totalFat+(p.fat||0);
return nd;
});
S.mt=””;S.mp=null;S.mpp=null;S.smf=false;S.ld=false;S.ae=””;
render();
}).catch(function(err){
S.ld=false;S.ae=“Could not analyze. Check internet and try again.”;render();
});
}

function rmeal(i){
upd(S.ad,function(d){
var m=d.meals[i];
var nd=copyDay(d);
nd.meals=d.meals.filter(function(_,j){return j!==i;});
nd.totalProtein=d.totalProtein-(m.protein||0);
nd.totalCalories=d.totalCalories-(m.calories||0);
nd.totalCarbs=d.totalCarbs-(m.carbs||0);
nd.totalFat=d.totalFat-(m.fat||0);
return nd;
});
}

function cpclick(){
var week=gw(S.wo);
var wkts=0,sumP=0,sumCal=0,pdays=0,notes=[];
var wts=[];
for(var i=0;i<7;i++){
var d=week[i];
if(d.workout.completed)wkts++;
sumP+=d.totalProtein;
sumCal+=d.totalCalories;
if(d.totalProtein>=PG)pdays++;
if(d.workout.notes)notes.push(DAYS[i]+”: “+d.workout.notes);
wts.push(parseFloat(d.weight)||0);
}
var lwts=wts.filter(function(w){return w>0;});
var avgWt=lwts.length?(lwts.reduce(function(a,b){return a+b;},0)/lwts.length).toFixed(1):”–”;
var txt=“WEEKLY CHECK-IN - “+wlbl(S.wo)+
“\nWorkouts: “+wkts+”/5”+
“\nAvg protein: “+Math.round(sumP/7)+“g (goal: “+PG+“g)”+
“\nProtein goal days: “+pdays+”/7”+
“\nAvg calories: “+Math.round(sumCal/7)+
“\nAvg weight: “+avgWt+” lbs”+
“\nNotes: “+(notes.length?notes.join(”, “):“None”);
navigator.clipboard.writeText(txt).then(function(){
S.cp=true;render();
setTimeout(function(){S.cp=false;render();},2500);
}).catch(function(){S.cp=true;render();setTimeout(function(){S.cp=false;render();},2500);});
}

function cc2(v,g){
if(v>=g)return”#10b981”;
if(v>0)return”#f59e0b”;
return”#2a2a2a”;
}

function mkRing(val,max,color){
var size=64,sw=6;
var r=(size-sw*2)/2;
var c=2*Math.PI*r;
var pct=val/max;if(pct>1)pct=1;if(pct<0)pct=0;
var off=c*(1-pct);
return ‘<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">’+
‘<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#181818" stroke-width="'+sw+'"/>’+
‘<circle cx=”’+size/2+’” cy=”’+size/2+’” r=”’+r+’” fill=“none” stroke=”’+color+’” stroke-width=”’+sw+’”’+
’ stroke-dasharray=”’+c+’” stroke-dashoffset=”’+off+’” stroke-linecap=“round”/>’+
‘</svg>’;
}

function mkBar(lbl,val,max,color){
var unit=lbl===“Calories”?””:“g”;
var pct=val/max*100;if(pct>100)pct=100;
return ‘<div class="bar">’+
‘<div class="blr"><span>’+lbl+’</span><span class="blrv">’+val+unit+’ / ‘+max+unit+’</span></div>’+
‘<div class="bt"><div class="bf" style="width:'+pct+'%;background:'+color+'"></div></div>’+
‘</div>’;
}

function render(){
var week=gw(S.wo);
var day=week[S.ad];
var dt=DT[DAYS[S.ad]];
var sumP=0,sumCal=0,wkts=0,pdays=0;
var wts=[];
for(var i=0;i<7;i++){
sumP+=week[i].totalProtein;
sumCal+=week[i].totalCalories;
if(week[i].workout.completed)wkts++;
if(week[i].totalProtein>=PG)pdays++;
wts.push(parseFloat(week[i].weight)||0);
}
var avgP=Math.round(sumP/7);
var avgCal=Math.round(sumCal/7);
var lwts=wts.filter(function(w){return w>0;});
var avgWt=lwts.length?(lwts.reduce(function(a,b){return a+b;},0)/lwts.length).toFixed(1):”–”;

var html=””;

// HEADER
html+=’<div class="hdr">’+
‘<div class="hlbl">Daily Tracker</div>’+
‘<div class="hrow">’+
‘<div class="htitle">’+wlbl(S.wo)+’</div>’+
‘<div class="navb">’+
‘<button class="nbtn" onclick="S.wo--;render()">‹</button>’+
‘<button class="nbtn" onclick="S.wo++;render()">›</button>’+
‘</div></div>’+
(S.wo!==0?’<button class="bklnk" onclick="S.wo=0;render()">← Current week</button>’:””)+
‘</div>’;

// TABS
html+=’<div class="tabs">’;
for(var i=0;i<7;i++){
var d=DAYS[i];
var rest=DT[d]===“Rest”;
var act=i===S.ad;
var today=S.wo===0&&i===0;
html+=’<div class=“tab’+(act?” on”:””)+(rest?” rest”:””)+(today&&!act?” today”:””)+’” onclick=“S.ad=’+i+’;render()”>’;
html+=’<div class="tday">’+d+’</div>’;
html+=’<div class="ttype">’+DT[d]+’</div>’;
if(week[i].workout.completed)html+=’<div class="tdone">✓</div>’;
html+=’</div>’;
}
html+=’</div>’;

// VIEW TOGGLE
html+=’<div class="vtog">’+
‘<button class=“vbtn’+(S.view===“log”?” on”:””)+’” onclick=“S.view='log';render()”>Daily Log</button>’+
‘<button class=“vbtn’+(S.view===“week”?” on”:””)+’” onclick=“S.view='week';render()”>Week Summary</button>’+
‘</div>’;

html+=’<div class="pg">’;

if(S.view===“log”){
// WEIGHT & PROGRESS
html+=’<div class="card">’+
‘<div class="slbl">Daily Weight & Progress</div>’+
‘<div style="display:flex;align-items:center;margin-bottom:4px">’+
‘<input class=“winp” type=“number” step=“0.1” min=“50” max=“500” id=“winp” placeholder=“0.0” value=”’+(day.weight||””)+’” onchange=“upd(S.ad,function(d){var nd=copyDay(d);nd.weight=document.getElementById('winp').value;return nd;})”>’+
