<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0a0a0a;color:#ccc;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;max-width:480px;margin:0 auto;padding-bottom:100px;min-height:100vh;}
button,textarea,input{font-family:inherit;}
.hdr{padding:44px 20px 12px;background:#0d0d0d;border-bottom:1px solid #1c1c1c;position:sticky;top:0;z-index:100;}
.hdr-lbl{font-size:9px;letter-spacing:3px;color:#e8322a;text-transform:uppercase;margin-bottom:2px;}
.hdr-row{display:flex;justify-content:space-between;align-items:center;}
.hdr-title{font-size:18px;font-weight:700;color:#f0ede8;}
.nav{display:flex;gap:5px;}
.nav-btn{background:#181818;border:1px solid #252525;border-radius:6px;width:28px;height:28px;color:#888;font-size:16px;cursor:pointer;}
.back{background:none;border:none;color:#e8322a;font-size:10px;padding:2px 0 0;cursor:pointer;}
.tabs{display:flex;gap:5px;padding:10px 20px;overflow-x:auto;background:#0d0d0d;border-bottom:1px solid #1c1c1c;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;border-radius:10px;padding:6px 10px;text-align:center;border:1px solid #1c1c1c;background:#121212;cursor:pointer;}
.tab.on{background:#e8322a;border-color:#e8322a;}
.tab.rest{opacity:0.4;}
.tab-d{font-size:8px;letter-spacing:1px;color:#3a3a3a;text-transform:uppercase;margin-bottom:1px;}
.tab.on .tab-d{color:rgba(255,255,255,0.5);}
.tab-t{font-size:10px;font-weight:600;color:#888;}
.tab.on .tab-t{color:#fff;}
.tab-done{font-size:7px;color:#e8322a;margin-top:2px;}
.tab.on .tab-done{color:rgba(255,255,255,0.7);}
.vtog{display:flex;gap:6px;padding:12px 20px 0;}
.vbtn{background:transparent;border:1px solid #181818;border-radius:8px;padding:5px 14px;color:#3a3a3a;font-size:11px;cursor:pointer;}
.vbtn.on{background:#181818;border-color:#252525;color:#f0ede8;font-weight:600;}
.pg{padding:12px 20px 0;}
.card{background:#111;border:1px solid #1c1c1c;border-radius:14px;padding:16px;margin-bottom:12px;}
.slbl{font-size:9px;letter-spacing:3px;color:#444;text-transform:uppercase;margin-bottom:12px;}
/* WEIGHT */
.w-row{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
.w-inp{background:#0c0c0c;border:1px solid #1c1c1c;border-radius:8px;color:#f0ede8;font-size:22px;font-weight:700;padding:10px 14px;width:130px;text-align:center;}
.w-unit{font-size:14px;color:#555;}
.w-ok{font-size:10px;color:#10b981;margin-top:4px;}
/* PROGRESS PHOTOS */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.pslot{background:#0c0c0c;border:1px dashed #252525;border-radius:10px;aspect-ratio:3/4;position:relative;overflow:hidden;cursor:pointer;}
.pslot.has{border-style:solid;border-color:#1c1c1c;}
.pinner{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:12px;}
.picon{font-size:22px;margin-bottom:6px;}
.plbl{font-size:10px;color:#444;text-align:center;}
.pimg{width:100%;height:100%;object-fit:cover;display:block;}
.prem{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.75);border:none;border-radius:50%;width:24px;height:24px;color:#fff;font-size:11px;cursor:pointer;}
.ptyp{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:1px;text-transform:uppercase;}
/* MACROS */
.mring-row{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
.rw{position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ri{position:absolute;text-align:center;}
.rv{font-size:12px;font-weight:700;color:#f0ede8;}
.rs{font-size:7px;color:#444;}
.bar{margin-bottom:7px;}
.blr{display:flex;justify-content:space-between;font-size:10px;color:#555;margin-bottom:3px;}
.blr span:last-child{color:#999;}
.bt{background:#181818;border-radius:3px;height:4px;}
.bf{height:100%;border-radius:3px;transition:width 0.4s;}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.chip{background:#0c0c0c;border-radius:8px;padding:8px 4px;text-align:center;}
.cv{font-size:13px;font-weight:700;}
.cl{font-size:8px;color:#383838;margin-top:1px;}
/* WATER */
.wtr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.wtr-val{font-size:16px;font-weight:700;color:#3b82f6;}
.wtr-btns{display:flex;gap:6px;}
.wtr-btn{border-radius:8px;width:32px;height:32px;font-size:16px;border:none;cursor:pointer;}
.wtr-m{background:#181818;border:1px solid #252525 !important;color:#888;}
.wtr-p{background:#3b82f6;color:#fff;}
.wsegs{display:flex;gap:4px;}
.wseg{flex:1;height:6px;border-radius:3px;background:#181818;cursor:pointer;transition:background 0.2s;}
.wseg.on{background:#3b82f6;}
/* MEALS */
.mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.addbtn{background:#e8322a;border:none;border-radius:8px;padding:5px 12px;color:#fff;font-size:11px;font-weight:600;cursor:pointer;}
.mform{background:#0c0c0c;border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid #1a1a1a;}
.mhint{font-size:11px;color:#555;margin-bottom:10px;}
.phbtn{width:100%;background:#111;border:1px dashed #252525;border-radius:8px;padding:10px 0;color:#444;font-size:12px;cursor:pointer;margin-bottom:10px;}
.pvw{position:relative;margin-bottom:10px;}
.pvw img{width:100%;max-height:150px;object-fit:cover;border-radius:8px;display:block;}
.pvrm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.75);border:none;border-radius:50%;width:24px;height:24px;color:#fff;font-size:12px;cursor:pointer;}
.pvbdg{position:absolute;bottom:6px;left:8px;background:#10b981;border-radius:4px;padding:2px 8px;font-size:9px;color:#fff;}
.mta{width:100%;background:#111;border:1px solid #1c1c1c;border-radius:8px;color:#f0ede8;font-size:12px;padding:10px;resize:none;height:60px;margin-bottom:8px;display:block;}
.aerr{color:#e8322a;font-size:11px;margin-bottom:8px;}
.fbtns{display:flex;gap:8px;}
.cbtn{flex:1;background:transparent;border:1px solid #252525;border-radius:8px;color:#555;font-size:12px;padding:8px 0;cursor:pointer;}

.nomeal{text-align:center;color:#2a2a2a;font-size:12px;padding:14px 0;}
.mi{background:#0c0c0c;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #181818;}
.mihdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.miname{font-size:13px;color:#f0ede8;font-weight:500;}
.midesc{font-size:10px;color:#3a3a3a;margin-top:1px;}
.mirm{background:none;border:none;color:#2a2a2a;font-size:13px;padding:0;margin-left:8px;cursor:pointer;}
.miph{width:100%;max-height:90px;object-fit:cover;border-radius:6px;margin-bottom:8px;display:block;}
.mmacs{display:flex;gap:5px;}
.mm{background:#141414;border-radius:6px;padding:4px 7px;text-align:center;}
.mmv{font-size:12px;font-weight:700;}
.mml{font-size:8px;color:#383838;}
/* WORKOUT */
.wbtn{width:100%;border-radius:10px;padding:10px 0;color:#fff;font-size:13px;font-weight:600;margin-bottom:10px;border:1px solid #252525;background:#141414;cursor:pointer;}
.wbtn.done{background:#e8322a;border:none;}
.rhint{font-size:10px;color:#444;margin-bottom:8px;}
.rrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.rbtn{background:transparent;border:1px solid #1e1e1e;border-radius:8px;padding:5px 9px;color:#444;font-size:11px;cursor:pointer;}
.rbtn.on{background:#1c1c1c;border-color:#e8322a;color:#f0ede8;}
.wnotes{width:100%;background:#0c0c0c;border:1px solid #181818;border-radius:8px;color:#ccc;font-size:12px;padding:10px;resize:none;height:60px;}

.wstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.wstat{background:#111;border:1px solid #1c1c1c;border-radius:12px;padding:12px 8px;text-align:center;}
.wsv{font-size:18px;font-weight:700;}
.wss{font-size:9px;color:#3a3a3a;margin-top:2px;}
.wsl{font-size:9px;color:#2a2a2a;margin-top:1px;}
.drow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #181818;cursor:pointer;}
.drow.rest{opacity:0.3;}
.dname{font-size:12px;font-weight:600;color:#f0ede8;}
.dtype{color:#383838;font-weight:400;font-size:10px;}
.dsub{font-size:10px;color:#3a3a3a;margin-top:1px;}
.dright{text-align:right;}
.dprot{font-size:13px;font-weight:700;}
.dcal{font-size:9px;color:#383838;}
.dwt{font-size:10px;color:#f59e0b;margin-top:1px;}
.dtrn{font-size:8px;color:#e8322a;margin-top:1px;}
.wchart{display:flex;align-items:flex-end;gap:4px;height:56px;padding-top:8px;border-top:1px solid #181818;margin-top:12px;}
.wbar-w{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.wbar{width:100%;border-radius:3px 3px 0 0;min-height:2px;}
.wbard{font-size:7px;color:#3a3a3a;}
.wbarv{font-size:7px;color:#f59e0b;}
.cbox{background:#0c0c0c;border-radius:10px;padding:12px;font-size:11px;color:#666;line-height:2;border:1px solid #181818;font-family:monospace;}
.ctitle{color:#e8322a;font-weight:600;margin-bottom:4px;}
.cnote{padding-left:8px;color:#4a4a4a;}
.copybtn{width:100%;background:#181818;border:1px solid #252525;border-radius:8px;padding:8px 0;color:#888;font-size:12px;margin-top:10px;cursor:pointer;}
.copybtn.ok{color:#10b981;border-color:#10b981;}
</style>
</head>

:“Analyze: "”+S.mt+”". Return ONLY raw JSON no markdown: {"name":"short name","protein":number,"carbs":number,"fat":number,"calories":number}. Standard portion estimates.”

function rmeal(i){
upd(S.ad,function(d){
var m=d.meals[i];
return Object.assign({},d,{
meals:d.meals.filter(function(_,j){return j!==i;}),
totalProtein:d.totalProtein-m.protein,
totalCalories:d.totalCalories-m.calories,
totalCarbs:d.totalCarbs-m.carbs,
totalFat:d.totalFat-m.fat
});
});
}

function cc(txt){
navigator.clipboard.writeText(txt).then(function(){
S.cp=true;render();
setTimeout(function(){S.cp=false;render();},2500);
});
}

function ring(val,max,color,size,sw){

return’<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">’+

’ stroke-dasharray=”’+c+’” stroke-dashoffset=”’+(c*(1-pct))+’” stroke-linecap=“round”/>’+
‘</svg>’;
}

‘<div class="bt"><div class="bf" style="width:'+Math.min(val/max*100,100)+'%;background:'+color+'"></div></div></div>’;
}

function cc2(v,g){return v>=g?”#10b981”:v>0?”#f59e0b”:”#2a2a2a”;}

(week[i].workout.completed?’<div class="tab-done">\u2713</div>’:’’)+
