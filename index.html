function wlbl(o){

  var s=new Date(WS+o*604800000),e=new Date(WS+o*604800000+518400000);

}

  if(!AW[o]){AW[o]=[];for(var i=0;i<7;i++){AW[o].push(nd());}}

// OFFLINE-FIRST SYNC SYSTEM
var SYNC_KEY="mytracker";
var CLOUD_URL="https://tracker-proxy.vinny-olsauskas.workers.dev/data";
var syncRetryTimer=null;
var syncPending=false;

function save(){
  // Step 1: Always save locally first, instantly
  var localOk=false;
  try{
    var data=JSON.stringify(AW);
    localStorage.setItem(SYNC_KEY,data);
    var check=localStorage.getItem(SYNC_KEY);
    if(check&&check.length===data.length){localOk=true;}
  }catch(e){localOk=false;}

  showToast(localOk?"local":null);

  if(localOk){
    S.lastSaved=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    updateSavedLabel();
  }

  // Step 2: Try to push to cloud in background
  syncPending=true;
  pushToCloud();
}

function pushToCloud(){
  if(!syncPending){return;}
  var data=localStorage.getItem(SYNC_KEY);
  if(!data){return;}
  fetch(CLOUD_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"save",payload:data})
  }).then(function(r){
    if(r.ok){
      syncPending=false;
      if(syncRetryTimer){clearInterval(syncRetryTimer);syncRetryTimer=null;}
      S.cloudSynced=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
      updateSavedLabel();
      showToast("cloud");
    }else{
      scheduleRetry();
    }
  }).catch(function(){
    scheduleRetry();
  });
}

function scheduleRetry(){
  if(syncRetryTimer){return;}
  syncRetryTimer=setInterval(function(){
    if(syncPending){pushToCloud();}
    else{clearInterval(syncRetryTimer);syncRetryTimer=null;}
  },30000);
  updateSavedLabel();
}

function updateSavedLabel(){
  var el=document.getElementById("last-saved");
  if(!el){return;}
  if(S.cloudSynced){
    el.textContent="Synced "+S.cloudSynced;
    el.style.color="#10b981";
  }else if(syncPending){
    el.textContent="Saved locally, syncing...";
    el.style.color="#f59e0b";
  }else if(S.lastSaved){
    el.textContent="Saved "+S.lastSaved;
    el.style.color="#444";
  }
}

function showToast(type){
  var existing=document.getElementById("save-toast");
  if(existing){existing.remove();}
  if(!type){return;}
  var t=document.createElement("div");
  t.id="save-toast";
  var msg=type==="cloud"?"Synced to cloud":type==="local"?"Saved":"Save failed";
  var bg=type==="cloud"?"#10b981":type==="local"?"#3b82f6":"#e8322a";
  t.textContent=msg;
  t.style.cssText="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:"+bg+";color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:9999;pointer-events:none;transition:opacity 0.4s;font-family:-apple-system,system-ui,sans-serif;";
  document.body.appendChild(t);
  var dur=type==="cloud"?2000:1200;
  setTimeout(function(){t.style.opacity="0";setTimeout(function(){if(t.parentNode){t.remove();}},400);},dur);
}

function load(){
  // Try cloud first, fall back to localStorage
  fetch(CLOUD_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"load"})
  }).then(function(r){return r.json();}).then(function(resp){
    if(resp&&resp.payload){
      try{
        var cloudData=JSON.parse(resp.payload);
        AW=cloudData;
        // Also update localStorage with cloud data
        try{localStorage.setItem(SYNC_KEY,resp.payload);}catch(e){}
        S.cloudSynced=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
        syncPending=false;
        draw();
      }catch(e){loadFromLocal();}
    }else{
      loadFromLocal();
    }
  }).catch(function(){
    loadFromLocal();
  });
}

function loadFromLocal(){
  try{
    var r=localStorage.getItem(SYNC_KEY);
    if(r){AW=JSON.parse(r);}
  }catch(e){}
  // Mark as pending sync so it will retry
  var hasData=Object.keys(AW).length>0;
  if(hasData){syncPending=true;scheduleRetry();}
  draw();
}
function gday(){return gw(S.wo)[S.ad];}

function gex(nm){
  var d=gday();
  if(!d.exercises||!d.exercises[nm]){return{done:false,rating:"",note:"",active:false};}
  return d.exercises[nm];
}

function sex(nm,field,val){
  var wk=gw(S.wo);var d=wk[S.ad];
  if(!d.exercises){d.exercises={};}
  if(!d.exercises[nm]){d.exercises[nm]={done:false,rating:"",note:"",active:false};}
  d.exercises[nm][field]=val;
  AW[S.wo]=wk;save();draw();
}

function toggleDone(nm){
  var wk=gw(S.wo);var d=wk[S.ad];
  if(!d.exercises){d.exercises={};}
  if(!d.exercises[nm]){d.exercises[nm]={done:false,rating:"",note:"",active:false};}
  d.exercises[nm].done=!d.exercises[nm].done;
  d.exercises[nm].active=false;
  AW[S.wo]=wk;save();draw();
}

function setActive(nm){
  var wk=gw(S.wo);var d=wk[S.ad];
  if(!d.exercises){d.exercises={};}
  var keys=Object.keys(d.exercises);
  for(var ki=0;ki<keys.length;ki++){if(!d.exercises[keys[ki]].done){d.exercises[keys[ki]].active=false;}}
  if(!d.exercises[nm]){d.exercises[nm]={done:false,rating:"",note:"",active:false};}
  if(!d.exercises[nm].done){d.exercises[nm].active=!d.exercises[nm].active;}
  AW[S.wo]=wk;save();draw();
}

function exDoneCount(){
  var d=gday();if(!d.exercises){return 0;}
  var ct=0,keys=Object.keys(d.exercises);
  for(var ki=0;ki<keys.length;ki++){if(d.exercises[keys[ki]].done){ct++;}}
  return ct;
}

function exTotalCount(){
  var dn=DAYS[S.ad];if(!PLAN[dn]){return 0;}
  var ct=0,secs=PLAN[dn].sections;
  for(var si=0;si<secs.length;si++){ct+=secs[si].exs.length;}
  return ct;
}

function hprog(e,side){

  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement("canvas");
      var mx=400,w=img.width,h=img.height;
      if(w>mx||h>mx){if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}
      cv.width=w;cv.height=h;
      var ctx=cv.getContext("2d");ctx.drawImage(img,0,0,w,h);
      var comp=cv.toDataURL("image/jpeg",0.4);
      sday(function(d){if(side==="front"){d.photoFront=comp;}else{d.photoSide=comp;}return d;});
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
}

function rprog(side){
  sday(function(d){if(side==="front"){d.photoFront=null;d.photoFrontDesc=null;}else{d.photoSide=null;d.photoSideDesc=null;}return d;});
}

function hmeal(e){
  var f=e.target.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement("canvas");
      var mx=400,w=img.width,h=img.height;
      if(w>mx||h>mx){if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}
      cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
      var comp=cv.toDataURL("image/jpeg",0.4);
      S.mp=comp.split(",")[1];S.mpp=comp;draw();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
}

function callAPI(msgs,maxT,cb){
  fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxT,messages:msgs})
  }).then(function(r){return r.json();}).then(function(data){
    var txt="";
    if(data.content){for(var i=0;i<data.content.length;i++){if(data.content[i].type==="text"){txt=data.content[i].text;break;}}}
    cb(null,txt);
  }).catch(function(err){cb(err,null);});
}

function analyzeMeal(){
  var ta=document.getElementById("meal-ta");if(ta){S.mt=ta.value;}
  if(!S.mt&&!S.mp)return;
  S.ld=true;S.ae="";draw();
  var content=[];
  if(S.mp){content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:S.mp}});}
  var prompt=S.mp
    ?"Analyze this food photo"+(S.mt?" plus: "+S.mt:"")+". Return ONLY raw JSON no markdown: {\"name\":\"meal name\",\"protein\":25,\"carbs\":30,\"fat\":10,\"calories\":300}"
    :"Analyze: "+S.mt+". Return ONLY raw JSON no markdown: {\"name\":\"meal name\",\"protein\":25,\"carbs\":30,\"fat\":10,\"calories\":300}";
  content.push({type:"text",text:prompt});
  callAPI([{role:"user",content:content}],400,function(err,txt){
    if(err){S.ld=false;S.ae="Could not analyze. Try again.";draw();return;}
    try{
      var p=JSON.parse(txt.replace(/```json|```/g,"").trim());
      var prev=S.mpp,inp=S.mt;
      sday(function(d){
        d.meals.push({name:p.name||"Meal",protein:p.protein||0,carbs:p.carbs||0,fat:p.fat||0,calories:p.calories||0,input:inp,photo:prev});
        d.p+=p.protein||0;d.cal+=p.calories||0;d.carbs+=p.carbs||0;d.fat+=p.fat||0;
        return d;
      });
      S.mt="";S.mp=null;S.mpp=null;S.smf=false;S.ld=false;S.ae="";draw();
    }catch(e){S.ld=false;S.ae="Could not parse. Try again.";draw();}
  });
}

function rmMeal(idx){
  sday(function(d){
    var m=d.meals[idx];d.meals.splice(idx,1);
    d.p-=m.protein||0;d.cal-=m.calories||0;d.carbs-=m.carbs||0;d.fat-=m.fat||0;
    return d;
  });
}

function doExport(wo){
  S.exporting=true;draw();
  var wk=gw(wo);
  var photos=[];
  for(var di=0;di<7;di++){
    var d=wk[di];
    if(d.photoFront){photos.push({di:di,side:"front",data:d.photoFront.split(",")[1]});}
    if(d.photoSide){photos.push({di:di,side:"side",data:d.photoSide.split(",")[1]});}
    if(d.meals){for(var mi=0;mi<d.meals.length;mi++){if(d.meals[mi].photo){photos.push({di:di,mi:mi,data:d.meals[mi].photo.split(",")[1]});}}}
  }
  var totalP=0,wkts=0,pdays=0,wts=[];
  for(var di=0;di<7;di++){
    var d=wk[di];totalP+=d.p;
    if(d.workout&&d.workout.completed){wkts++;}
    if(d.p>=PG){pdays++;}
    if(d.weight){wts.push(parseFloat(d.weight));}
  }
  var avgP=Math.round(totalP/7);
  var lwts=wts.filter(function(w){return w>0;});
  var avgWt=lwts.length?(lwts.reduce(function(a,b){return a+b;},0)/lwts.length).toFixed(1):"--";
  var lines=["WEEKLY CHECK-IN - "+wlbl(wo),
    "Workouts: "+wkts+"/5",
    "Avg protein: "+avgP+"g (goal: "+PG+"g)",
    "Protein days: "+pdays+"/7",
    "Avg weight: "+avgWt+" lbs"];
  var exFb=[];
  for(var di=0;di<7;di++){
    var d=wk[di];
    if(d.exercises){
      var eks=Object.keys(d.exercises);
      for(var eki=0;eki<eks.length;eki++){
        var ex=d.exercises[eks[eki]];
        if(ex.rating||ex.note){exFb.push(DAYS[di]+" "+eks[eki]+": "+(ex.rating||"")+(ex.note?" - "+ex.note:""));}
      }
    }
  }
  if(exFb.length){lines.push("Exercise feedback:");for(var fi=0;fi<exFb.length;fi++){lines.push("  "+exFb[fi]);}}
  var txt=lines.join("\n");
  if(photos.length===0){finishExport(wo,txt,{});return;}
  var descs={},pending=photos.length;
  function analyzePhoto(item){
    var content=[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:item.data}},
      {type:"text",text:"Describe this "+(item.side?"progress photo ("+item.side+" view)":"food photo")+" in one concise sentence for fitness tracking."}];
    callAPI([{role:"user",content:content}],150,function(err,dtxt){
      var key=item.di+(item.side?"-"+item.side:"-meal"+item.mi);
      descs[key]=dtxt||"Photo logged";
      pending--;
      if(pending===0){finishExport(wo,txt,descs);}
    });
  }
  for(var pi=0;pi<photos.length;pi++){analyzePhoto(photos[pi]);}
}

function finishExport(wo,txt,descs){
  var wk=gw(wo);
  for(var di=0;di<7;di++){
    var d=wk[di];
    if(d.photoFront){d.photoFrontDesc=descs[di+"-front"]||"Front progress photo";d.photoFront=null;}
    if(d.photoSide){d.photoSideDesc=descs[di+"-side"]||"Side progress photo";d.photoSide=null;}
    if(d.meals){for(var mi=0;mi<d.meals.length;mi++){if(d.meals[mi].photo){d.meals[mi].photoDesc=descs[di+"-meal"+mi]||"Food photo";d.meals[mi].photo=null;}}}
  }
  AW[wo]=wk;save();
  navigator.clipboard.writeText(txt).then(function(){
    S.exporting=false;S.expDone=true;draw();
    setTimeout(function(){S.expDone=false;draw();},3000);
  }).catch(function(){
    S.exporting=false;S.expDone=true;draw();
    setTimeout(function(){S.expDone=false;draw();},3000);
  });
}

function pcolor(v){return v>=PG?"#10b981":v>0?"#f59e0b":"#2a2a2a";}

function ring(val,max,color,sz,sw){
  sz=sz||64;sw=sw||6;
  var r=(sz-sw*2)/2,c=2*Math.PI*r,pct=Math.min(val/max,1);
  return "<svg width='"+sz+"' height='"+sz+"' style='transform:rotate(-90deg)'>"+
    "<circle cx='"+sz/2+"' cy='"+sz/2+"' r='"+r+"' fill='none' stroke='#181818' stroke-width='"+sw+"'/>"+
    "<circle cx='"+sz/2+"' cy='"+sz/2+"' r='"+r+"' fill='none' stroke='"+color+"' stroke-width='"+sw+"'"+
    " stroke-dasharray='"+(2*Math.PI*r)+"' stroke-dashoffset='"+(2*Math.PI*r*(1-pct))+"' stroke-linecap='round'/></svg>";
}

function mkbar(lbl,val,max,color){
  var unit=lbl==="Calories"?"":"g",pct=Math.min(val/max*100,100);
  return "<div class='bar'><div class='blr'><span>"+lbl+"</span><span style='color:#999'>"+val+unit+" / "+max+unit+"</span></div>"+
    "<div class='bt'><div class='bf' style='width:"+pct+"%;background:"+color+"'></div></div></div>";
}

function wkstats(wk){
  var totalP=0,wkts=0,pdays=0,wts=[];
  for(var i=0;i<7;i++){
    totalP+=wk[i].p;
    if(wk[i].workout&&wk[i].workout.completed){wkts++;}
    if(wk[i].p>=PG){pdays++;}
    if(wk[i].weight){wts.push(parseFloat(wk[i].weight));}
  }
  var lwts=wts.filter(function(w){return w>0;});
  var avgWt=lwts.length?(lwts.reduce(function(a,b){return a+b;},0)/lwts.length).toFixed(1):"--";
  return{avgP:Math.round(totalP/7),wkts:wkts,pdays:pdays,wts:wts,avgWt:avgWt};
}

    h+="<button class='addbtn' onclick='S.smf=true;draw()'>+ Add Meal</button></div>";
    if(S.smf){
      h+="<div style='background:#0c0c0c;border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid #1a1a1a'>";
      h+="<div style='font-size:11px;color:#555;margin-bottom:10px'>Upload a photo, describe your meal, or both. Claude fills in the macros.</div>";
      h+="<input type='file' id='meal-photo-inp' accept='image/*' style='display:none' onchange='hmeal(event)'>";
      if(S.mpp){
        h+="<div style='position:relative;margin-bottom:10px'><img src='"+S.mpp+"' style='width:100%;max-height:150px;object-fit:cover;border-radius:8px;display:block'>";
        h+="<button onclick='S.mp=null;S.mpp=null;draw()' style='position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.75);border:none;border-radius:50%;width:24px;height:24px;color:#fff;font-size:12px;cursor:pointer'>X</button>";
        h+="<div style='position:absolute;bottom:6px;left:8px;background:#10b981;border-radius:4px;padding:2px 8px;font-size:9px;color:#fff'>Photo ready</div></div>";
      }else{
        h+="<button class='phbtn' onclick='document.getElementById(\"meal-photo-inp\").click()'>&#128247; Upload Food Photo (optional)</button>";
      }
      h+="<textarea class='mta' id='meal-ta' placeholder='Describe what you ate...'>"+(S.mt||"")+"</textarea>";
      if(S.ae){h+="<div style='color:#e8322a;font-size:11px;margin-bottom:8px'>"+S.ae+"</div>";}
      h+="<div style='display:flex;gap:8px'>";
      h+="<button class='cancelbtn' onclick='S.smf=false;S.mt=\"\";S.mp=null;S.mpp=null;S.ae=\"\";draw()'>Cancel</button>";
      h+="<button class='anlzbtn' onclick='analyzeMeal()' "+(S.ld?"disabled":"")+">"+(S.ld?"Analyzing...":"Analyze + Log")+"</button>";
      h+="</div></div>";
    }
    if(day.meals.length===0&&!S.smf){h+="<div style='text-align:center;color:#2a2a2a;font-size:12px;padding:14px 0'>No meals logged yet</div>";}
    for(var mi=0;mi<day.meals.length;mi++){
      var m=day.meals[mi];
      h+="<div style='background:#0c0c0c;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #181818'>";
      h+="<div style='display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px'>";
      h+="<div style='flex:1'><div style='font-size:13px;color:#f0ede8;font-weight:500'>"+m.name+"</div>";
      if(m.input){h+="<div style='font-size:10px;color:#3a3a3a;margin-top:1px'>"+m.input+"</div>";}
      h+="</div><button onclick='rmMeal("+mi+")' style='background:none;border:none;color:#2a2a2a;font-size:13px;padding:0;margin-left:8px;cursor:pointer'>X</button></div>";
      if(m.photo){h+="<img src='"+m.photo+"' style='width:100%;max-height:90px;object-fit:cover;border-radius:6px;margin-bottom:8px;display:block'>";}
      if(m.photoDesc){h+="<div style='font-size:10px;color:#555;margin-bottom:6px;font-style:italic'>"+m.photoDesc+"</div>";}
      h+="<div style='display:flex;gap:5px'>";
      var mdata=[["P",m.protein,"#e8322a"],["C",m.carbs,"#f59e0b"],["F",m.fat,"#3b82f6"],["kcal",m.calories,"#10b981"]];
      for(var mdi=0;mdi<mdata.length;mdi++){
        h+="<div style='background:#141414;border-radius:6px;padding:4px 7px;text-align:center'><div style='font-size:12px;font-weight:500;color:"+mdata[mdi][2]+"'>"+mdata[mdi][1]+(mdata[mdi][0]!=="kcal"?"g":"")+"</div><div style='font-size:8px;color:#383838'>"+mdata[mdi][0]+"</div></div>";
      }
      h+="</div></div>";
    }
    h+="</div>";
  }

  // ===== WORKOUT VIEW =====
  if(S.view==="workout"&&dtype!=="Rest"){
    var plan=PLAN[DAYS[S.ad]];
    if(plan){
      var exDone=exDoneCount();var exTotal=exTotalCount();
      var isCardio=DAYS[S.ad]==="Wed";

      h+="<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:14px'>";
      h+="<div><div style='font-size:9px;letter-spacing:3px;color:#444;text-transform:uppercase;margin-bottom:3px'>"+DAYS[S.ad]+"</div>";
      h+="<div style='font-size:20px;font-weight:500;color:#f0ede8'>"+plan.title+"</div>";
      h+="<div style='font-size:11px;color:#555;margin-top:2px'>"+plan.sub+"</div></div>";

      if(!isCardio){
        h+="<div style='position:relative;width:52px;height:52px'>"+ring(exDone,Math.max(exTotal,1),"#e8322a",52,4);
        h+="<div style='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center'>";
        h+="<div style='font-size:13px;font-weight:500;color:#f0ede8'>"+exDone+"</div>";
        h+="<div style='font-size:7px;color:#555'>of "+exTotal+"</div></div></div>";
      }
      h+="</div>";

      if(isCardio){
        // CARDIO - plain phase list + single session feedback
        for(var sci=0;sci<plan.sections.length;sci++){
          var sec=plan.sections[sci];
          h+="<div style='font-size:9px;letter-spacing:3px;color:#444;text-transform:uppercase;margin-bottom:10px'>"+sec.lbl+"</div>";
          h+="<div class='card' style='padding:12px 14px'>";
          for(var exi=0;exi<sec.exs.length;exi++){
            var ex=sec.exs[exi];
            var isLast=exi===sec.exs.length-1;
            h+="<div style='display:flex;justify-content:space-between;align-items:center;padding:9px 0;"+(isLast?"":"border-bottom:1px solid #1a1a1a")+"'>";
            h+="<div style='font-size:13px;font-weight:500;color:#f0ede8'>"+ex.n+"</div>";
            h+="<div style='font-size:11px;color:#555;text-align:right;max-width:55%'>"+ex.d+"</div>";
            h+="</div>";
          }
          h+="</div>";
        }
        var cs=gex("cardio-session");
        h+="<div class='card'>";
        h+="<div class='slbl'>Session Feedback</div>";
        h+="<div style='display:flex;gap:5px;margin-bottom:10px'>";
        for(var ri=0;ri<RATINGS.length;ri++){
          var rv=RATINGS[ri];
          h+="<button class='erbtn"+(cs.rating===rv?" sel":"")+"' onclick='sex(\"cardio-session\",\"rating\",\""+(cs.rating===rv?"":rv)+"\")'>"+rv+"</button>";
        }
        h+="</div>";
        h+="<textarea class='ex-textarea' id='cardio-note' placeholder='How did the session feel? Notes...' style='margin-top:0'>"+(cs.note||"")+"</textarea>";
        h+="</div>";

      }else{
        // REGULAR WORKOUT - exercise checklist with feedback
        for(var sci=0;sci<plan.sections.length;sci++){
          var sec=plan.sections[sci];
          h+="<div style='font-size:9px;letter-spacing:3px;color:#444;text-transform:uppercase;margin-bottom:10px'>"+sec.lbl+"</div>";
          for(var exi=0;exi<sec.exs.length;exi++){
            var ex=sec.exs[exi];
            var exst=gex(ex.n);
            var isDone=exst.done;
            var isAct=exst.active&&!isDone;
            var hasFb=isDone||isAct;
            h+="<div class='ex-card"+(isDone?" done":isAct?" prog":" todo")+"'>";
            h+="<div style='display:flex;justify-content:space-between;align-items:center"+(hasFb?";margin-bottom:10px":"")+"'>";
            h+="<div style='display:flex;align-items:center;gap:10px'>";
            if(isDone){
              h+="<div class='ex-circle-done' onclick='toggleDone(\""+ex.n+"\")'><svg width='10' height='10' viewBox='0 0 10 10'><path d='M2 5l2 2 4-4' stroke='#fff' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg></div>";
            }else if(isAct){
              h+="<div class='ex-circle-prog' onclick='toggleDone(\""+ex.n+"\")'><div style='width:6px;height:6px;border-radius:50%;background:#f59e0b'></div></div>";
            }else{
              h+="<div class='ex-circle-todo' onclick='setActive(\""+ex.n+"\")'></div>";
            }
            h+="<div><div style='font-size:13px;font-weight:500;color:#f0ede8'>"+ex.n+"</div>";
            h+="<div style='font-size:11px;color:#555;margin-top:1px'>"+ex.d+"</div></div></div>";
            if(ex.u){
              h+="<button class='demo-btn"+(isAct?" on":"")+"' onclick='S.activeVid=S.activeVid===\""+ex.n+"\"?null:\""+ex.n+"\";draw()'>&#9654; Demo</button>";
            }
            h+="</div>";
            if(S.activeVid===ex.n&&ex.u){
              h+="<div style='background:#0c0c0c;border-radius:8px;overflow:hidden;margin-bottom:10px'>";
              h+="<iframe width='100%' style='aspect-ratio:16/9;border:none;border-radius:8px;display:block' src='"+ex.u+"' allowfullscreen></iframe>";
              h+="</div>";
            }
            if(hasFb){
              h+="<div style='display:flex;gap:5px;margin-bottom:8px'>";
              for(var ri2=0;ri2<RATINGS.length;ri2++){
                var rv2=RATINGS[ri2];
                h+="<button class='erbtn"+(exst.rating===rv2?" sel":"")+"' onclick='sex(\""+ex.n+"\",\"rating\",\""+(exst.rating===rv2?"":rv2)+"\")'>"+rv2+"</button>";
              }
              h+="</div>";
              if(isAct){
                h+="<textarea class='ex-textarea' id='exnote-"+exi+"-"+sci+"' placeholder='How did it feel? Weight adjustments, notes...'>"+(exst.note||"")+"</textarea>";
              }else{
                h+="<div class='ex-note"+(exst.note?" has":"")+"' onclick='setActive(\""+ex.n+"\")'>"+(exst.note||"Tap to add a note...")+"</div>";
              }
            }
            h+="</div>";
          }
        }
      }
    }
  }

  h+="</div>";
  document.getElementById("root").innerHTML=h;

  // Event listeners
  var mta=document.getElementById("meal-ta");
  if(mta){mta.addEventListener("input",function(e){S.mt=e.target.value;});}

  var wi=document.getElementById("weight-inp");
  if(wi){wi.addEventListener("blur",function(e){sday(function(d){d.weight=e.target.value;return d;});});}

  var cn=document.getElementById("cardio-note");
  if(cn){cn.addEventListener("blur",function(e){sex("cardio-session","note",e.target.value);});}

  if(S.view==="workout"&&PLAN[DAYS[S.ad]]){
    var plan2=PLAN[DAYS[S.ad]];
    for(var sci2=0;sci2<plan2.sections.length;sci2++){
      for(var exi2=0;exi2<plan2.sections[sci2].exs.length;exi2++){
        var el=document.getElementById("exnote-"+exi2+"-"+sci2);
        if(el){
          (function(nm){
            el.addEventListener("blur",function(e){sex(nm,"note",e.target.value);});
          })(plan2.sections[sci2].exs[exi2].n);
        }
      }
    }
  }
}

// Auto jump to today
(function(){
  var now=new Date();
  S.ad=now.getDay();
  S.wo=0;
  S.view="log";
})();
// Load data - cloud first, falls back to local, each calls draw() when ready
load();
</script>
</body>
</html>
