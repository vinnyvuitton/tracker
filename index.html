<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://vinny-workout-api.vinny-olsauskas.workers.dev; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout 2.0">
  <title>Workout 2.0</title>
  <link rel="manifest" href="manifest.webmanifest?v=2.0.2">
  <link rel="stylesheet" href="styles.css?v=2.0.2">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-view="today">Today</button>
    <button data-view="progress">Progress</button>
    <button data-view="plan">Plan</button>
    <button data-view="checkin">Check-in</button>
  </nav>

  <dialog id="access-dialog">
    <form method="dialog" id="access-form">
      <h2>Unlock your private tracker</h2>
      <p>Enter the access code you create during the secure setup. It stays on this device.</p>
      <label>Access code
        <input id="access-token" type="password" autocomplete="current-password" required>
      </label>
      <p id="access-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Cancel</button>
        <button value="default" id="access-submit">Unlock</button>
      </div>
    </form>
  </dialog>

  <dialog id="photo-dialog">
    <form method="dialog" id="photo-form">
      <h2 id="photo-title">Add progress photo</h2>
      <p>Use the same lighting, distance, posture, and clothing each time.</p>
      <input id="photo-input" type="file" accept="image/*" capture="user" required>
      <p id="photo-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Cancel</button>
        <button value="default" id="photo-submit">Save photo</button>
      </div>
    </form>
  </dialog>

  <script src="migration.js?v=2.0.2"></script>
  <script src="app.js?v=2.0.2"></script>
</body>
</html>
